
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>El dilema del riesgo</title>

  <style>
    /* =====================================================
       CONTENEDOR GENERAL
       ===================================================== */

    #simulador-moneda {
      max-width: 650px;
      margin: 40px auto;
      padding: 30px;
      border: 1px solid #d6d6d6;
      border-radius: 18px;
      background-color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    #simulador-moneda h2 {
      margin-top: 0;
      color: #243447;
    }

    #simulador-moneda p {
      color: #4b5563;
      line-height: 1.5;
    }

    .instruccion-dinamica {
      margin: 18px 0 10px;
      padding: 16px 18px;
      border-radius: 12px;
      background-color: #f3f7fc;
      color: #334155;
      line-height: 1.55;
    }

    .instruccion-dinamica strong {
      color: #173f73;
    }

    /* =====================================================
       ESCENARIO DE LA MONEDA
       ===================================================== */

    .escenario-moneda {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      height: 455px;
      margin: 20px 0;
      perspective: 1000px;
      overflow: hidden;
    }

    /*
      Este contenedor se desplaza verticalmente para simular
      que la moneda se lanza hacia arriba.
    */
    .contenedor-salto {
      position: relative;
      width: 125px;
      height: 125px;
      transform: translateY(-25px);
      will-change: transform;
    }

    /* =====================================================
       MONEDA
       ===================================================== */

    .moneda {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transform-style: preserve-3d;
      transform: rotateY(0deg);
      will-change: transform;
    }

    .cara-moneda {
      position: absolute;
      inset: 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      border: 8px solid #b97800;
      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 30%,
          #fff4b0 0%,
          #f7c94b 35%,
          #d99a13 72%,
          #a96800 100%
        );

      color: #704500;
      box-sizing: border-box;

      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;

      box-shadow:
        inset 0 0 0 5px rgba(255, 255, 255, 0.28),
        inset 0 0 18px rgba(80, 45, 0, 0.35),
        0 10px 18px rgba(0, 0, 0, 0.25);
    }

    .cara-moneda::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 2px dashed rgba(112, 69, 0, 0.55);
      border-radius: 50%;
    }

    .cara-moneda span {
      position: relative;
      z-index: 1;
    }

    .simbolo-moneda {
      font-size: 48px;
      font-weight: bold;
      line-height: 1;
    }

    .texto-moneda {
      margin-top: 7px;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    /* Lado frontal: Águila */
    .moneda-aguila {
      transform: rotateY(0deg);
    }

    /* Lado posterior: Sol */
    .moneda-sol {
      transform: rotateY(180deg);
    }

    /* =====================================================
       SOMBRA
       ===================================================== */

    .sombra-moneda {
      position: absolute;
      bottom: 12px;
      width: 108px;
      height: 20px;
      border-radius: 50%;
      background-color: rgba(0, 0, 0, 0.22);
      filter: blur(5px);
      transform: scale(1);
      will-change: transform, opacity;
    }

    /* =====================================================
       RESULTADO
       ===================================================== */

    .resultado {
      min-height: 94px;
      margin: 10px 0 20px;
      padding: 14px 16px;
      border-radius: 12px;
      background-color: #f8fafc;
      color: #1f2937;
      line-height: 1.4;
    }

    .mensaje-principal {
      display: block;
      font-size: 24px;
      font-weight: bold;
    }

    .mensaje-secundario {
      display: block;
      margin-top: 7px;
      font-size: 16px;
      font-weight: normal;
      color: #4b5563;
    }

    .resultado-aguila {
      border: 1px solid #e5c15a;
      background-color: #fff9e7;
      color: #8a5900;
    }

    .resultado-sol {
      border: 1px solid #d5d9df;
      background-color: #f4f5f7;
      color: #4b5563;
    }

    /* =====================================================
       BOTONES
       ===================================================== */

    .botones {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .botones button {
      min-width: 160px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition:
        transform 0.2s ease,
        background-color 0.2s ease,
        opacity 0.2s ease;
    }

    #boton-lanzar {
      background-color: #1565c0;
      color: #ffffff;
    }

    #boton-lanzar:hover:not(:disabled) {
      background-color: #0d4f9a;
      transform: translateY(-2px);
    }

    #boton-reiniciar {
      border: 1px solid #b8c0ca;
      background-color: #f3f4f6;
      color: #374151;
    }

    #boton-reiniciar:hover:not(:disabled) {
      background-color: #e5e7eb;
      transform: translateY(-2px);
    }

    .botones button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }


    /* =====================================================
       RESULTADO EN PANTALLA COMPLETA
       ===================================================== */

    #fuegos-artificiales {
      position: fixed;
      inset: 0;
      z-index: 1000;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .resultado-pantalla-completa {
      position: fixed;
      inset: 0;
      z-index: 950;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(20px, 5vw, 70px);
      overflow: hidden;
      color: #1f2937;
    }

    .resultado-pantalla-completa[hidden] {
      display: none;
    }

    /*
      Se conservan los mismos colores que en los mensajes
      mostrados debajo de la moneda.
    */
    .resultado-pantalla-completa.aguila {
      border: 3px solid #e5c15a;
      background:
        radial-gradient(
          circle at top,
          #ffffff 0%,
          #fff9e7 68%,
          #f5e6ae 100%
        );
      color: #8a5900;
    }

    .resultado-pantalla-completa.sol {
      border: 3px solid #d5d9df;
      background:
        radial-gradient(
          circle at top,
          #ffffff 0%,
          #f4f5f7 68%,
          #dde1e6 100%
        );
      color: #4b5563;
    }

    .resultado-pantalla-contenido {
      width: min(100%, 1100px);
      text-align: center;
      color: inherit;
      animation:
        entrada-pantalla-completa 700ms
        cubic-bezier(0.18, 0.82, 0.28, 1.18);
    }

    .resultado-pantalla-icono {
      display: block;
      margin-bottom: clamp(10px, 2vh, 22px);
      font-size: clamp(7rem, 24vw, 16rem);
      line-height: 1;
      filter:
        drop-shadow(0 7px 7px rgba(0, 0, 0, 0.16));
    }

    .resultado-pantalla-titulo {
      display: block;
      font-size: clamp(3rem, 9vw, 7rem);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.035em;
      color: inherit;
      text-shadow:
        0 4px 12px rgba(255, 255, 255, 0.75);
    }

    .resultado-pantalla-texto {
      display: block;
      max-width: 950px;
      margin: clamp(18px, 4vh, 36px) auto 0;
      font-size: clamp(1.35rem, 4vw, 2.7rem);
      line-height: 1.35;
      font-weight: 700;
      color: inherit;
    }

    .resultado-pantalla-aviso {
      position: absolute;
      right: 0;
      bottom: clamp(14px, 3vh, 28px);
      left: 0;
      padding: 0 20px;
      color: inherit;
      font-size: clamp(0.85rem, 1.8vw, 1.05rem);
      text-align: center;
      opacity: 0.68;
    }

    .resultado-pantalla-completa.saliendo {
      animation:
        salida-pantalla-completa 420ms ease forwards;
    }

    @keyframes entrada-pantalla-completa {
      0% {
        opacity: 0;
        transform: scale(0.5) rotate(-2deg);
      }

      65% {
        opacity: 1;
        transform: scale(1.055) rotate(1deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes salida-pantalla-completa {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    /* =====================================================
       DISEÑO RESPONSIVO
       ===================================================== */

    @media (max-width: 500px) {
      #simulador-moneda {
        margin: 20px 10px;
        padding: 22px 15px;
      }

      .escenario-moneda {
        height: 440px;
      }

      .contenedor-salto {
        width: 110px;
        height: 110px;
      }

      .simbolo-moneda {
        font-size: 36px;
      }

      .texto-moneda {
        font-size: 14px;
      }

      .mensaje-principal {
        font-size: 21px;
      }

      .botones button {
        width: 100%;
      }
    }

    /*
      Reduce la animación cuando el usuario ha configurado
      su dispositivo para evitar movimientos intensos.
    */
    @media (prefers-reduced-motion: reduce) {
      .botones button {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <canvas
    id="fuegos-artificiales"
    aria-hidden="true">
  </canvas>

  <section
    id="resultado-pantalla-completa"
    class="resultado-pantalla-completa"
    role="status"
    aria-live="assertive"
    aria-atomic="true"
    hidden
  >
    <div
      id="resultado-pantalla-contenido"
      class="resultado-pantalla-contenido">
    </div>

  
  </section>

  <section id="simulador-moneda">

    <h2>El dilema del riesgo</h2>

    <div class="escenario-moneda">

      <div
        id="sombra-moneda"
        class="sombra-moneda"
        aria-hidden="true">
      </div>

      <div id="contenedor-salto" class="contenedor-salto">

        <div
          id="moneda"
          class="moneda"
          role="img"
          aria-label="Moneda mostrando Águila">

          <!-- Lado correspondiente a Águila -->
          <div class="cara-moneda moneda-aguila">
            <span class="simbolo-moneda">A</span>
            <span class="texto-moneda">ÁGUILA</span>
          </div>

          <!-- Lado correspondiente a Sol -->
          <div class="cara-moneda moneda-sol">
            <span class="simbolo-moneda">S</span>
            <span class="texto-moneda">SOL</span>
          </div>

        </div>

      </div>

    </div>

    <!-- aria-live permite anunciar el resultado a lectores de pantalla -->
    <div
      id="resultado-moneda"
      class="resultado"
      aria-live="polite">
      <span class="mensaje-principal">
        ¿Seguridad o riesgo?
      </span>
      <span class="mensaje-secundario">
        Tomen su decisión antes de lanzar la moneda.
      </span>
    </div>

    <div class="botones">
      <button id="boton-lanzar" type="button">
        Lanzar moneda
      </button>

      <button id="boton-reiniciar" type="button">
        Reiniciar
      </button>
    </div>

  </section>

  <script>
    (() => {
      "use strict";

      const moneda = document.getElementById("moneda");
      const contenedorSalto = document.getElementById("contenedor-salto");
      const sombra = document.getElementById("sombra-moneda");

      const resultado = document.getElementById("resultado-moneda");

      const botonLanzar = document.getElementById("boton-lanzar");
      const botonReiniciar = document.getElementById("boton-reiniciar");

      const pantallaCompleta =
        document.getElementById(
          "resultado-pantalla-completa"
        );

      const pantallaCompletaContenido =
        document.getElementById(
          "resultado-pantalla-contenido"
        );

      const canvasFuegos =
        document.getElementById("fuegos-artificiales");

      const contextoFuegos =
        canvasFuegos.getContext("2d");

      /*
       * Ángulo actual de la moneda:
       *
       * 0 grados   = Águila
       * 180 grados = Sol
       */
      let anguloActual = 0;

      let lanzamientoEnCurso = false;

      /* =====================================================
         AJUSTES DE LA ANIMACIÓN
         ===================================================== */

      /*
       * Duración total del lanzamiento, en milisegundos.
       * Un valor menor produce un movimiento más rápido.
       * Un valor mayor produce un movimiento más lento.
       */
      const TIEMPO_EN_AIRE = 3000;

      /*
       * Altura máxima del lanzamiento, en píxeles.
       * Un valor mayor hace que la moneda suba más.
       */
      const ALTURA_LANZAMIENTO = 325;

      /*
       * Número de vueltas durante el lanzamiento.
       * Más vueltas en el mismo tiempo producen un giro más rápido.
       */
      const VUELTAS_MINIMAS = 7;
      const VUELTAS_MAXIMAS = 10;

      /*
       * Tiempo que el resultado permanece en pantalla completa.
       */
      const DURACION_PANTALLA_COMPLETA = 5000;

      /*
       * Retardo entre el final del lanzamiento y la aparición
       * del resultado en pantalla completa.
       */
      const RETARDO_RESULTADO_PANTALLA = 150;

      let temporizadorPantallaCompleta = null;
      let particulasFuegos = [];
      let animacionFuegos = null;
      let tiempoFinalFuegos = 0;

      /**
       * Coloca un mensaje principal y otro complementario.
       */
      function mostrarMensaje(principal, secundario, claseAdicional = "") {
        resultado.className =
          claseAdicional
            ? `resultado ${claseAdicional}`
            : "resultado";

        resultado.innerHTML = `
          <span class="mensaje-principal">${principal}</span>
          <span class="mensaje-secundario">${secundario}</span>
        `;
      }

      function ajustarCanvasFuegos() {
        const proporcion = Math.max(
          1,
          Math.min(window.devicePixelRatio || 1, 2)
        );

        canvasFuegos.width =
          Math.floor(window.innerWidth * proporcion);

        canvasFuegos.height =
          Math.floor(window.innerHeight * proporcion);

        canvasFuegos.style.width =
          `${window.innerWidth}px`;

        canvasFuegos.style.height =
          `${window.innerHeight}px`;

        contextoFuegos.setTransform(
          proporcion,
          0,
          0,
          proporcion,
          0,
          0
        );
      }

      function crearExplosion(x, y, tipo) {
        const coloresAguila = [
          "#ffd166",
          "#f4a261",
          "#e9c46a",
          "#ffffff",
          "#d99a13"
        ];

        const coloresSol = [
          "#ffffff",
          "#d5d9df",
          "#9aa3ad",
          "#f1f3f5",
          "#b8c0ca"
        ];

        const colores =
          tipo === "aguila"
            ? coloresAguila
            : coloresSol;

        const cantidad =
          tipo === "aguila" ? 38 : 27;

        for (let i = 0; i < cantidad; i++) {
          const angulo =
            (Math.PI * 2 * i) / cantidad +
            Math.random() * 0.18;

          const velocidad =
            (2.2 + Math.random() * 4.4) *
            (tipo === "aguila" ? 1.1 : 0.85);

          particulasFuegos.push({
            x,
            y,
            anteriorX: x,
            anteriorY: y,
            vx: Math.cos(angulo) * velocidad,
            vy: Math.sin(angulo) * velocidad,
            gravedad: 0.055 + Math.random() * 0.04,
            friccion: 0.982,
            vida: 1,
            desgaste: 0.011 + Math.random() * 0.01,
            tamano: 1.4 + Math.random() * 2.1,
            color:
              colores[
                Math.floor(Math.random() * colores.length)
              ]
          });
        }
      }

      function dibujarFuegos() {
        contextoFuegos.clearRect(
          0,
          0,
          window.innerWidth,
          window.innerHeight
        );

        contextoFuegos.globalCompositeOperation =
          "lighter";

        particulasFuegos = particulasFuegos.filter(
          particula => particula.vida > 0
        );

        particulasFuegos.forEach(particula => {
          particula.anteriorX = particula.x;
          particula.anteriorY = particula.y;

          particula.vx *= particula.friccion;
          particula.vy *= particula.friccion;
          particula.vy += particula.gravedad;

          particula.x += particula.vx;
          particula.y += particula.vy;
          particula.vida -= particula.desgaste;

          contextoFuegos.beginPath();
          contextoFuegos.moveTo(
            particula.anteriorX,
            particula.anteriorY
          );
          contextoFuegos.lineTo(
            particula.x,
            particula.y
          );

          contextoFuegos.lineWidth =
            particula.tamano;

          contextoFuegos.strokeStyle =
            particula.color;

          contextoFuegos.globalAlpha =
            Math.max(particula.vida, 0);

          contextoFuegos.stroke();
        });

        contextoFuegos.globalAlpha = 1;
        contextoFuegos.globalCompositeOperation =
          "source-over";

        if (
          particulasFuegos.length > 0 ||
          performance.now() < tiempoFinalFuegos
        ) {
          animacionFuegos =
            requestAnimationFrame(dibujarFuegos);
        } else {
          animacionFuegos = null;

          contextoFuegos.clearRect(
            0,
            0,
            window.innerWidth,
            window.innerHeight
          );
        }
      }

      function lanzarFuegosArtificiales(tipo) {
        if (
          window.matchMedia(
            "(prefers-reduced-motion: reduce)"
          ).matches
        ) {
          return;
        }

        ajustarCanvasFuegos();

        if (animacionFuegos !== null) {
          cancelAnimationFrame(animacionFuegos);
        }

        particulasFuegos = [];

        tiempoFinalFuegos =
          performance.now() +
          (tipo === "aguila" ? 3200 : 2200);

        const explosiones =
          tipo === "aguila" ? 9 : 5;

        for (let i = 0; i < explosiones; i++) {
          window.setTimeout(() => {
            const margenX =
              window.innerWidth * 0.12;

            const x =
              margenX +
              Math.random() *
                (window.innerWidth - 2 * margenX);

            const y =
              window.innerHeight * 0.12 +
              Math.random() *
                (window.innerHeight * 0.48);

            crearExplosion(x, y, tipo);
          }, i * 270);
        }

        animacionFuegos =
          requestAnimationFrame(dibujarFuegos);
      }

      function ocultarResultadoPantallaCompleta() {
        if (pantallaCompleta.hidden) {
          return;
        }

        pantallaCompleta.classList.add("saliendo");

        window.setTimeout(() => {
          pantallaCompleta.hidden = true;
          pantallaCompleta.className =
            "resultado-pantalla-completa";

          pantallaCompletaContenido.innerHTML = "";
          document.body.style.overflow = "";
        }, 420);
      }

      function mostrarResultadoPantallaCompleta(tipo) {
        if (temporizadorPantallaCompleta !== null) {
          window.clearTimeout(
            temporizadorPantallaCompleta
          );
        }

        pantallaCompleta.className =
          `resultado-pantalla-completa ${tipo}`;

        if (tipo === "aguila") {
          pantallaCompletaContenido.innerHTML =
            `<span class="resultado-pantalla-icono" ` +
            `aria-hidden="true">😎</span>` +
            `<strong class="resultado-pantalla-titulo">` +
            `¡ÁGUILA! Ganaron $30,000</strong>`
        } else {
          pantallaCompletaContenido.innerHTML =
            `<span class="resultado-pantalla-icono" ` +
            `aria-hidden="true">😭</span>` +
            `<strong class="resultado-pantalla-titulo">` +
            `¡SOL! Lo perdieron todo</strong>` 
        }

        document.body.style.overflow = "hidden";
        pantallaCompleta.hidden = false;

        void pantallaCompletaContenido.offsetWidth;

        lanzarFuegosArtificiales(tipo);

        temporizadorPantallaCompleta =
          window.setTimeout(() => {
            ocultarResultadoPantallaCompleta();
            temporizadorPantallaCompleta = null;
          }, DURACION_PANTALLA_COMPLETA);
      }

      /**
       * Genera un resultado equiprobable.
       *
       * Se utiliza crypto.getRandomValues cuando está disponible.
       * El último bit del número generado determina el resultado:
       *
       * 0 = Águila
       * 1 = Sol
       */
      function generarResultadoJusto() {
        if (
          window.crypto &&
          typeof window.crypto.getRandomValues === "function"
        ) {
          const numeroAleatorio = new Uint32Array(1);
          window.crypto.getRandomValues(numeroAleatorio);

          return (numeroAleatorio[0] & 1) === 0
            ? "aguila"
            : "sol";
        }

        /*
         * Alternativa para navegadores antiguos.
         */
        return Math.random() < 0.5
          ? "aguila"
          : "sol";
      }

      /**
       * Devuelve un número entero aleatorio entre mínimo y máximo.
       */
      function enteroAleatorio(minimo, maximo) {
        return Math.floor(
          Math.random() * (maximo - minimo + 1)
        ) + minimo;
      }

      /**
       * Realiza la animación del lanzamiento.
       */
      async function lanzarMoneda() {
        if (lanzamientoEnCurso) {
          return;
        }

        lanzamientoEnCurso = true;

        botonLanzar.disabled = true;
        botonReiniciar.disabled = true;

        mostrarMensaje(
          "¡La decisión está tomada!",
          "La moneda está en el aire..."
        );

        const resultadoLanzamiento = generarResultadoJusto();

        /*
         * Ángulo final:
         *
         * Águila termina en 0 grados.
         * Sol termina en 180 grados.
         */
        const anguloResultado =
          resultadoLanzamiento === "aguila" ? 0 : 180;

        const anguloNormalizado =
          ((anguloActual % 360) + 360) % 360;

        const diferencia =
          (anguloResultado - anguloNormalizado + 360) % 360;

        /*
         * Entre 7 y 10 vueltas completas para que el lanzamiento
         * tenga una apariencia natural.
         */
        const vueltasCompletas = enteroAleatorio(
          VUELTAS_MINIMAS,
          VUELTAS_MAXIMAS
        );

        const anguloFinal =
          anguloActual +
          vueltasCompletas * 360 +
          diferencia;

        const reducirMovimiento =
          window.matchMedia(
            "(prefers-reduced-motion: reduce)"
          ).matches;

        const duracion = reducirMovimiento
          ? 500
          : TIEMPO_EN_AIRE;

        const altura = reducirMovimiento
          ? 25
          : ALTURA_LANZAMIENTO;

        /*
         * Animación vertical de la moneda.
         */
        const animacionSalto = contenedorSalto.animate(
          [
            {
              transform: "translateY(-25px) scale(1)",
              offset: 0
            },
            {
              transform:
                `translateY(-${altura}px) scale(1.06)`,
              offset: 0.5
            },
            {
              transform: "translateY(-25px) scale(1)",
              offset: 1
            }
          ],
          {
            duration: duracion,
            easing: "cubic-bezier(0.25, 0.75, 0.35, 1)",
            fill: "forwards"
          }
        );

        /*
         * Animación de rotación.
         */
        const animacionGiro = moneda.animate(
          [
            {
              transform: `rotateY(${anguloActual}deg)`
            },
            {
              transform: `rotateY(${anguloFinal}deg)`
            }
          ],
          {
            duration: duracion,
            easing: "cubic-bezier(0.18, 0.68, 0.28, 1)",
            fill: "forwards"
          }
        );

        /*
         * La sombra se hace más pequeña cuando la moneda
         * se encuentra en la parte superior.
         */
        const animacionSombra = sombra.animate(
          [
            {
              transform: "scale(1)",
              opacity: 0.25
            },
            {
              transform: "scale(0.42)",
              opacity: 0.08,
              offset: 0.5
            },
            {
              transform: "scale(1)",
              opacity: 0.25
            }
          ],
          {
            duration: duracion,
            easing: "ease-in-out",
            fill: "forwards"
          }
        );

        try {
          await Promise.all([
            animacionSalto.finished,
            animacionGiro.finished,
            animacionSombra.finished
          ]);
        } catch (error) {
          /*
           * Evita errores visibles si una animación se cancela.
           */
        }

        /*
         * Se fija la posición final de la moneda.
         */
        anguloActual = anguloResultado;

        moneda.style.transform =
          `rotateY(${anguloActual}deg)`;

        contenedorSalto.style.transform =
          "translateY(-25px)";

        sombra.style.transform = "scale(1)";
        sombra.style.opacity = "0.25";

        animacionSalto.cancel();
        animacionGiro.cancel();
        animacionSombra.cancel();

        /*
         * Actualización del resultado de acuerdo con la dinámica.
         */
        if (resultadoLanzamiento === "aguila") {
          mostrarMensaje(
            "¡ÁGUILA! Ganaron $30,000",
            "Quienes aceptaron el volado fueron recompensados. Esta vez, tomar el riesgo dio resultado.",
            "resultado-aguila"
          );

          moneda.setAttribute(
            "aria-label",
            "Moneda mostrando Águila"
          );

          window.setTimeout(() => {
            mostrarResultadoPantallaCompleta(
              "aguila"
            );
          }, RETARDO_RESULTADO_PANTALLA);
        } else {
          mostrarMensaje(
            "¡SOL! Lo perdieron todo",
            "Esta vez el riesgo no fue favorable. Quienes eligieron la opción segura conservaron sus $10,000.",
            "resultado-sol"
          );

          moneda.setAttribute(
            "aria-label",
            "Moneda mostrando Sol"
          );

          window.setTimeout(() => {
            mostrarResultadoPantallaCompleta(
              "sol"
            );
          }, RETARDO_RESULTADO_PANTALLA);
        }

        lanzamientoEnCurso = false;

        botonLanzar.disabled = false;
        botonReiniciar.disabled = false;
        botonLanzar.focus();
      }

      /**
       * Reinicia la simulación.
       */
      function reiniciarSimulacion() {
        if (lanzamientoEnCurso) {
          return;
        }

        anguloActual = 0;

        if (temporizadorPantallaCompleta !== null) {
          window.clearTimeout(
            temporizadorPantallaCompleta
          );
          temporizadorPantallaCompleta = null;
        }

        pantallaCompleta.hidden = true;
        pantallaCompleta.className =
          "resultado-pantalla-completa";

        pantallaCompletaContenido.innerHTML = "";
        document.body.style.overflow = "";

        if (animacionFuegos !== null) {
          cancelAnimationFrame(animacionFuegos);
          animacionFuegos = null;
        }

        particulasFuegos = [];

        contextoFuegos.clearRect(
          0,
          0,
          window.innerWidth,
          window.innerHeight
        );

        moneda.style.transform = "rotateY(0deg)";

        moneda.setAttribute(
          "aria-label",
          "Moneda mostrando Águila"
        );

        mostrarMensaje(
          "¿Seguridad o riesgo?",
          "Tomen su decisión antes de lanzar nuevamente la moneda."
        );
      }

      botonLanzar.addEventListener(
        "click",
        lanzarMoneda
      );

      botonReiniciar.addEventListener(
        "click",
        reiniciarSimulacion
      );

      pantallaCompleta.addEventListener(
        "click",
        () => {
          if (temporizadorPantallaCompleta !== null) {
            window.clearTimeout(
              temporizadorPantallaCompleta
            );
            temporizadorPantallaCompleta = null;
          }

          ocultarResultadoPantallaCompleta();
        }
      );

      document.addEventListener(
        "keydown",
        evento => {
          if (
            evento.key === "Escape" &&
            !pantallaCompleta.hidden
          ) {
            if (
              temporizadorPantallaCompleta !== null
            ) {
              window.clearTimeout(
                temporizadorPantallaCompleta
              );

              temporizadorPantallaCompleta = null;
            }

            ocultarResultadoPantallaCompleta();
          }
        }
      );

      window.addEventListener(
        "resize",
        () => {
          if (
            particulasFuegos.length > 0 ||
            animacionFuegos !== null
          ) {
            ajustarCanvasFuegos();
          }
        }
      );
    })();
  </script>

</body>
</html>
