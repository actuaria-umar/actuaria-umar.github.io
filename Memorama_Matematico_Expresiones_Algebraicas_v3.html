<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memorama Matemático | Licenciatura en Actuaría</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #667085;
      --primary: #123d6a;
      --primary-2: #1f5f99;
      --accent: #e7b64b;
      --success: #25855a;
      --danger: #b54747;
      --border: #dce3ec;
      --shadow: 0 14px 35px rgba(18, 61, 106, 0.12);
      --card-shadow: 0 9px 20px rgba(28, 47, 73, 0.16);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(31, 95, 153, 0.08), transparent 25%),
        radial-gradient(circle at 90% 15%, rgba(231, 182, 75, 0.12), transparent 20%),
        var(--bg);
    }

    button,
    select {
      font: inherit;
    }

    .app {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 22px;
      align-items: end;
      background: linear-gradient(135deg, #123d6a, #1f5f99);
      color: white;
      padding: 28px;
      border-radius: 24px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 230px;
      height: 230px;
      border: 2px solid rgba(255,255,255,.12);
      border-radius: 50%;
      right: -80px;
      top: -100px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #f8d983;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.5rem);
      line-height: 1;
      letter-spacing: -0.035em;
    }

    .subtitle {
      max-width: 720px;
      margin: 12px 0 0;
      color: rgba(255,255,255,.86);
      line-height: 1.55;
      font-size: 1rem;
    }

    .hero-badge {
      min-width: 155px;
      padding: 14px 16px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 16px;
      backdrop-filter: blur(8px);
      text-align: center;
    }

    .hero-badge strong {
      display: block;
      font-size: 1.45rem;
    }

    .hero-badge span {
      color: rgba(255,255,255,.76);
      font-size: .82rem;
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr)) auto;
      gap: 12px;
      margin: 18px 0;
      align-items: stretch;
    }

    .stat,
    .control {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px 15px;
      box-shadow: 0 6px 18px rgba(18, 61, 106, 0.05);
    }

    .stat-label,
    .control label {
      display: block;
      font-size: .76rem;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 850;
      color: var(--primary);
    }

    .control select {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--primary);
      font-weight: 800;
      outline: none;
      cursor: pointer;
    }

    .btn {
      border: 0;
      border-radius: 16px;
      padding: 0 20px;
      min-height: 62px;
      background: var(--primary);
      color: white;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(18, 61, 106, 0.16);
      transition: transform .18s ease, background .18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: var(--primary-2);
    }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .board-wrap,

    .board-wrap {
      padding: 18px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr));
      gap: 14px;
    }

    .memory-card {
      position: relative;
      aspect-ratio: 1 / 1;
      border: 0;
      background: transparent;
      perspective: 900px;
      cursor: pointer;
      padding: 0;
    }

    .memory-card:focus-visible {
      outline: 4px solid rgba(231, 182, 75, .55);
      outline-offset: 4px;
      border-radius: 18px;
    }

    .card-inner {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      transform-style: preserve-3d;
      transition: transform .45s cubic-bezier(.2,.7,.2,1);
      box-shadow: var(--card-shadow);
    }

    .memory-card.is-flipped .card-inner,
    .memory-card.is-matched .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      backface-visibility: hidden;
      overflow: hidden;
    }

    .card-back {
      display: grid;
      place-items: center;
      color: white;
      background:
        linear-gradient(145deg, rgba(255,255,255,.08), transparent 45%),
        var(--primary);
      border: 2px solid rgba(255,255,255,.14);
    }

    .card-back .mark {
      display: grid;
      place-items: center;
      width: 58%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.9);
      font-size: clamp(1.6rem, 4vw, 2.8rem);
      font-weight: 900;
      letter-spacing: -.08em;
    }

    .card-back .mark {
      background: #fff;
      border-radius: 16px;
      padding: 8px;
      border: 0;
      width: 58%;
      aspect-ratio: 1;
    }

    .card-back .mark img {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: contain;
    }

    .card-back .mini {
      position: absolute;
      bottom: 10px;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .12em;
      opacity: .8;
    }

    .card-front {
      transform: rotateY(180deg);
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 30% 20%, #ffffff, #f2f6fb 68%),
        white;
      border: 2px solid #dbe6f0;
    }

    .card-front svg {
      width: 72%;
      height: 72%;
      filter: drop-shadow(0 7px 10px rgba(18, 61, 106, .12));
    }

    .memory-card.is-matched .card-front {
      border-color: rgba(37, 133, 90, .55);
      box-shadow: inset 0 0 0 4px rgba(37, 133, 90, .12);
    }

    .memory-card.is-matched {
      cursor: default;
    }

    .info-panel {
      padding: 20px;
      position: sticky;
      top: 16px;
    }

    .info-panel h2 {
      margin: 0 0 8px;
      font-size: 1.15rem;
      color: var(--primary);
    }

    .info-panel p {
      color: var(--muted);
      line-height: 1.5;
      font-size: .94rem;
      margin: 0;
    }

    .concept-card {
      margin-top: 16px;
      border-radius: 18px;
      padding: 18px;
      background: #f7f9fc;
      border: 1px solid var(--border);
      min-height: 220px;
      display: grid;
      align-content: center;
      justify-items: center;
      text-align: center;
    }

    .concept-icon {
      width: 118px;
      height: 118px;
      display: grid;
      place-items: center;
      margin-bottom: 12px;
    }

    .concept-icon svg {
      width: 100%;
      height: 100%;
    }

    .concept-name {
      margin: 0 0 7px;
      font-size: 1.15rem;
      color: var(--primary);
      font-weight: 900;
    }

    .concept-desc {
      margin: 0;
      font-size: .88rem !important;
    }

    .tip {
      margin-top: 14px;
      padding: 13px 14px;
      border-left: 4px solid var(--accent);
      background: #fff9e9;
      border-radius: 0 12px 12px 0;
      font-size: .86rem;
      color: #6b571a;
      line-height: 1.45;
    }

    .legend {
      margin-top: 16px;
      font-size: .78rem;
      color: var(--muted);
      text-align: center;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(13, 26, 43, .58);
      backdrop-filter: blur(6px);
      z-index: 50;
    }

    .modal.show {
      display: grid;
    }

    .modal-card {
      width: min(480px, 100%);
      background: white;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 30px 80px rgba(0,0,0,.25);
      text-align: center;
      animation: pop .28s ease-out;
    }

    @keyframes pop {
      from { transform: scale(.93); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-icon {
      width: 82px;
      height: 82px;
      margin: 0 auto 10px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e9f6ef;
      font-size: 2.2rem;
    }

    .modal h2 {
      margin: 8px 0;
      color: var(--primary);
      font-size: 1.7rem;
    }

    .modal p {
      color: var(--muted);
      line-height: 1.5;
    }

    .modal-results {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 20px 0;
    }

    .modal-results div {
      padding: 13px 8px;
      border-radius: 14px;
      background: #f5f7fa;
    }

    .modal-results strong {
      display: block;
      color: var(--primary);
      font-size: 1.25rem;
    }

    .modal-results span {
      color: var(--muted);
      font-size: .75rem;
    }


    .card-front {
      padding: 12px 10px 10px;
      grid-template-rows: 1fr auto;
      gap: 8px;
    }

    .card-front svg {
      width: 72%;
      height: 72%;
      max-height: 120px;
      align-self: end;
    }

    .card-label {
      width: 100%;
      padding: 7px 8px 8px;
      border-radius: 10px;
      background: #ffffff;
      color: var(--primary);
      font-size: clamp(.72rem, 1.3vw, .95rem);
      font-weight: 900;
      line-height: 1.15;
      text-align: center;
      border: 1px solid #dbe6f0;
      box-shadow: 0 3px 8px rgba(18, 61, 106, .06);
    }

    .memory-card.is-matched .card-label {
      background: #eef9f3;
      border-color: rgba(37, 133, 90, .35);
      color: #1d6a48;
    }

    @media (max-width: 950px) {
      .game-layout {
        grid-template-columns: 1fr;
      }

      .info-panel {
        position: static;
      }

      .concept-card {
        min-height: 0;
      }

      .toolbar {
        grid-template-columns: repeat(2, 1fr);
      }

      .btn {
        grid-column: span 2;
      }
    }

    @media (max-width: 720px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .hero-badge {
        justify-self: start;
      }

      .board {
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      .board-wrap {
        padding: 10px;
      }

      .card-inner,
      .card-face {
        border-radius: 12px;
      }

      .card-back .mini {
        display: none;
      }
    }

    @media (max-width: 480px) {
      .app {
        width: min(100% - 16px, 1180px);
        padding-top: 8px;
      }

      .hero {
        padding: 22px 18px;
        border-radius: 18px;
      }

      .toolbar {
        gap: 8px;
      }

      .stat,
      .control {
        padding: 10px 12px;
      }

      .board {
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }

      .board-wrap {
        border-radius: 16px;
        padding: 8px;
      }

      .card-back .mark {
        border-width: 2px;
      }
    }
    [hidden] { display: none !important; }
    .difficulty-screen { text-align: center; background: white; padding: clamp(24px,5vw,56px); border-radius: 24px; margin-top: 24px; }
    .difficulty-screen h2 { color: var(--primary); margin: 0 0 28px; }
    .difficulty-options { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
    .difficulty-options .btn { min-width: 180px; }
    .completion-time { display: grid; gap: 8px; margin: 24px 0; color: var(--primary); }
    .completion-time strong { font-size: 3rem; font-variant-numeric: tabular-nums; }
    .career-identity { display:flex; justify-content:center; padding: 8px 16px 24px; background: #fff; border-radius:24px 24px 0 0; }
    .career-logo { display:block; width:min(420px, 85%); height:auto; clip-path:inset(3px); border:0; }
    .hero { border-radius: 0 0 24px 24px; }
    .hero { grid-template-columns: 1fr; text-align: center; }
    body.playing { overflow: hidden; }
    body.playing .career-identity, body.playing .hero { display: none; }
    body.playing .app { width: 100%; height: 100dvh; padding: 0; margin: 0; }
    body.playing .game-layout { position: fixed; inset: 0; height: 100dvh; display: block; margin: 0; }
    body.playing .board-wrap { width: 100%; height: 100%; padding: clamp(6px,1vw,14px); border-radius: 0; }
    body.playing .board { width: 100%; height: 100%; gap: clamp(5px,1vw,12px); }
    body.playing .memory-card { aspect-ratio: auto; min-width: 0; min-height: 0; width: 100%; height: 100%; }
    body.playing .card-back .mark { width: auto; height: 65%; max-width: 70%; aspect-ratio: 1; padding: 5px; }
    body.playing .card-front { padding: 5px; gap: 3px; grid-template-rows: minmax(0,1fr) auto; }
    body.playing .card-front svg { height: 100%; width: 100%; max-height: none; min-height: 0; align-self: center; }
    body.playing .card-label { padding: 3px; font-size: clamp(.62rem,1.5vw,1rem); }
    body.playing .card-back .mini { bottom: 4px; font-size: clamp(.5rem,1vw,.7rem); }
    body.playing .card-back { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: clamp(3px, .8vh, 9px); }
    body.playing .card-back .mark { flex: 0 1 auto; height: 62%; max-height: calc(100% - 30px); min-height: 0; }
    body.playing .card-back .mini { position: static; display: block; flex: 0 0 auto; color: #fff; opacity: 1; font-weight: 800; line-height: 1.2; font-size: clamp(.6rem, 1.2vw, .95rem); letter-spacing: .12em; }
    /* Pantalla inicial contenida en la ventana, también al redimensionarla. */
    body:not(.playing) { height: 100dvh; min-height: 0; overflow: hidden; }
    body:not(.playing) .app {
      width: min(1180px, 100%); height: 100dvh; margin: 0 auto;
      padding: clamp(6px, 2vh, 18px); box-sizing: border-box;
      display: grid; grid-template-rows: minmax(0, 1fr) auto auto;
    }
    body:not(.playing) .career-identity { min-height: 0; padding: 0; align-items: center; overflow: hidden; }
    body:not(.playing) .career-logo { width: auto; height: auto; max-width: min(420px, 80vw); max-height: 100%; object-fit: contain; }
    body:not(.playing) .hero { display: block; padding: clamp(8px, 2vh, 22px); }
    body:not(.playing) .hero h1 { font-size: clamp(1.35rem, 5vmin, 3.5rem); }
    body:not(.playing) .difficulty-screen { margin-top: clamp(5px, 1.5vh, 16px); padding: clamp(8px, 2vh, 24px); }
    body:not(.playing) .difficulty-screen h2 { margin: 0 0 clamp(6px, 1.5vh, 18px); font-size: clamp(1rem, 3vmin, 1.5rem); }
    body:not(.playing) .difficulty-options { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(5px, 1vw, 14px); }
    body:not(.playing) .difficulty-options .btn { min-width: 0; min-height: 0; padding: clamp(8px, 2vh, 16px) 6px; font-size: clamp(.75rem, 2vmin, 1rem); }
    @media (max-width: 600px) {
      body:not(.playing) .difficulty-options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-height: 360px) and (min-width: 601px) {
      body:not(.playing) .app { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); grid-template-rows: auto minmax(0, 1fr); gap: 6px; }
      body:not(.playing) .career-identity { grid-row: 1 / 3; }
      body:not(.playing) .career-logo { max-width: 100%; }
      body:not(.playing) .hero { border-radius: 18px; }
      body:not(.playing) .difficulty-screen { margin: 0; align-self: center; }
    }
    .algebra-instruction { margin: 0 0 12px; color: var(--muted); font-size: clamp(.75rem, 2vmin, 1rem); }
    body.playing .card-front { display: flex; align-items: center; justify-content: center; padding: clamp(6px, 1.2vw, 20px); background: #fffdf6; }
    .algebra-expression { display: block; width: 100%; text-align: center; color: #123d6a; font-family: Georgia, 'Times New Roman', serif; font-weight: 700; font-size: clamp(.9rem, 2.3vw, 2.4rem); line-height: 1.6; overflow-wrap: normal; }
    @media (orientation: portrait) { .algebra-expression { font-size: clamp(.85rem, 3.3vw, 1.7rem); } }
    .algebra-expression { width: auto; max-width: 100%; white-space: nowrap; line-height: 1.25; flex: 0 1 auto; letter-spacing: 0; }
    /* Reverso: cuatro palabras alrededor del escudo de la UMAR. */
    body.playing .card-back {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 3fr) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) minmax(0, 5fr) minmax(0, 1fr);
      gap: 2px; padding: 5px; align-items: center; justify-items: center;
      container-type: size;
    }
    .back-top, .back-left, .back-right, body.playing .card-back .mini {
      color: white; font-weight: 800; line-height: 1.1; letter-spacing: .03em;
      font-size: clamp(8px, 7cqh, 20px); text-align: center;
    }
    .back-top { grid-column: 1 / 4; grid-row: 1; }
    .back-left { grid-column: 1; grid-row: 2; writing-mode: vertical-rl; transform: rotate(180deg); }
    .back-right { grid-column: 3; grid-row: 2; writing-mode: vertical-rl; }
    body.playing .card-back .mark {
      grid-column: 2; grid-row: 2; width: 100%; height: 100%; max-width: 100%; max-height: 100%;
      min-width: 0; min-height: 0; aspect-ratio: auto; padding: 4px; box-sizing: border-box;
    }
    body.playing .card-back .mini { grid-column: 1 / 4; grid-row: 3; position: static; }
    body:not(.playing) .hero h1 { font-size: clamp(1.2rem, 4vmin, 3rem); line-height: 1.15; }
  
    /* Ajuste proporcional de escudos y áreas disponibles. */
    .difficulty-options .btn { grid-column: auto; }
    html { height: 100%; }
    .career-logo, .card-back .mark img { object-fit: contain; object-position: center; }
    body:not(.playing) .career-logo { width: 100%; height: 100%; max-width: 460px; min-height: 0; clip-path: none; }
    body.playing .board-wrap { padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left)); }
    body.playing .card-back { grid-template-columns: minmax(0, 1fr) minmax(0, 9fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 6fr) minmax(0, 1fr); gap: 2px; padding: 4px; }
    body.playing .card-back .mark { background: white; border-radius: 8px; overflow: hidden; width: 100%; height: 100%; padding: 0; }
    body.playing .card-back .mark img { width: 100%; height: 100%; max-width: 100%; max-height: 100%; }
    .back-top, body.playing .card-back .mini { font-size: min(8cqw, 8cqh, 20px); letter-spacing: 0; }
    .back-left, .back-right { font-size: min(7cqw, 6cqh, 18px); letter-spacing: 0; }
    .modal { overflow: auto; }
    .modal-card { max-height: 100%; overflow: auto; }
    @media (max-height: 450px) and (orientation: landscape) {
      body:not(.playing) .app { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); grid-template-rows: auto minmax(0, 1fr); gap: 6px; }
      body:not(.playing) .career-identity { grid-row: 1 / 3; }
      body:not(.playing) .hero { border-radius: 18px; }
      body:not(.playing) .difficulty-screen { margin: 0; align-self: center; }
    }


    .fullscreen-toggle { position:fixed; top:max(8px, env(safe-area-inset-top)); right:max(8px, env(safe-area-inset-right)); z-index:1500; width:36px; height:36px; padding:9px; border:0; border-radius:50%; background:rgba(255,255,255,.94); color:#123d6a; box-shadow:0 2px 10px rgba(18,61,106,.12); cursor:pointer; display:grid; place-items:center; }
    .fullscreen-toggle svg { width:18px; height:18px; }
    .fullscreen-toggle:hover { background:#fff; box-shadow:0 2px 12px rgba(18,61,106,.25); }
    .fullscreen-toggle:focus-visible { outline:2px solid #c39328; outline-offset:3px; }
    body.playing .board-wrap { padding-top:max(48px, calc(env(safe-area-inset-top) + 44px)); }
  </style>
</head>
<body>
  <button id="fullscreenToggle" class="fullscreen-toggle" type="button" aria-label="Ver en pantalla completa" title="Ver en pantalla completa" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 4H4v5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>

    <section class="hero">
      <div>
        <h1>Memorama Matemático: Expresiones Algebraicas</h1>

      </div>
    </section>

    <section id="difficultyScreen" class="difficulty-screen" aria-labelledby="difficultyTitle">
      <h2 id="difficultyTitle">¿Qué dificultad deseas jugar?</h2>
      <p class="algebra-instruction">Encuentra parejas de expresiones algebraicas equivalentes.</p>
      <div class="difficulty-options">
        <button class="btn" data-pairs="6">Fácil · 6 parejas</button>
        <button class="btn" data-pairs="8">Media · 8 parejas</button>
        <button class="btn" data-pairs="10">Difícil · 10 parejas</button>
        <button class="btn" data-pairs="12">Experto · 12 parejas</button>
      </div>
    </section>

    <section class="game-layout" id="gameScreen" hidden>
      <div class="board-wrap">
        <div class="board" id="board" aria-label="Tablero de memorama"></div>
      </div>
    </section>
  </main>

  <div class="modal" id="winModal" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="modal-card">
      <div class="modal-icon">✓</div>
      <h2 id="winTitle">¡Memorama completado!</h2>
      <p>Encontraste todas las expresiones equivalentes.</p>
      <div class="completion-time" role="status">
        <span>Tiempo empleado</span>
        <strong id="finalTime">00:00</strong>
        <span>Intentos empleados</span>
        <strong id="finalMoves">0</strong>
      </div>
      <button class="btn" id="playAgainBtn" type="button">Nueva partida</button>
    </div>
  </div>

  <script>
    const concepts = [
      {"id": "cuadrado-suma", "name": "Expresión algebraica", "forms": ["(x + 3)²", "x² + 6x + 9"]},
      {"id": "cuadrado-resta", "name": "Expresión algebraica", "forms": ["(x − 4)²", "x² − 8x + 16"]},
      {"id": "conjugados", "name": "Expresión algebraica", "forms": ["(x + 5)(x − 5)", "x² − 25"]},
      {"id": "binomios", "name": "Expresión algebraica", "forms": ["(x + 2)(x + 3)", "x² + 5x + 6"]},
      {"id": "factor-comun", "name": "Expresión algebraica", "forms": ["3x(x + 2)", "3x² + 6x"]},
      {"id": "diferencia-cuadrados", "name": "Expresión algebraica", "forms": ["(2x − 3)(2x + 3)", "4x² − 9"]},
      {"id": "cubo-suma", "name": "Expresión algebraica", "forms": ["(x + 2)³", "x³ + 6x² + 12x + 8"]},
      {"id": "cubo-resta", "name": "Expresión algebraica", "forms": ["(x − 1)³", "x³ − 3x² + 3x − 1"]},
      {"id": "suma-cubos", "name": "Expresión algebraica", "forms": ["(x + 2)(x² − 2x + 4)", "x³ + 8"]},
      {"id": "diferencia-cubos", "name": "Expresión algebraica", "forms": ["(x − 3)(x² + 3x + 9)", "x³ − 27"]},
      {"id": "trinomio", "name": "Expresión algebraica", "forms": ["(2x + 1)(x + 3)", "2x² + 7x + 3"]},
      {"id": "agrupacion", "name": "Expresión algebraica", "forms": ["(x + 2)(y + 3)", "xy + 3x + 2y + 6"]}
    ];

    const board = document.getElementById("board");
    const difficultyScreen = document.getElementById("difficultyScreen");
    const gameScreen = document.getElementById("gameScreen");
    const playAgainBtn = document.getElementById("playAgainBtn");
    let pairCount = 8;
    let startedAt = 0;
    const winModal = document.getElementById("winModal");

    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let moves = 0;
    let matches = 0;
    let seconds = 0;
    let timerId = null;
    let timerStarted = false;
    let selectedConcepts = [];

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function startGame(chosenPairs) {
      document.body.classList.add("playing");
      pairCount = chosenPairs;
      difficultyScreen.hidden = true;
      gameScreen.hidden = false;
      stopTimer();
      timerStarted = false;
      seconds = 0;
      moves = 0;
      matches = 0;
      firstCard = null;
      secondCard = null;
      lockBoard = false;
      winModal.classList.remove("show");

      selectedConcepts = shuffle(concepts).slice(0, pairCount);

      const deck = shuffle(
        selectedConcepts.flatMap(concept => [
          { ...concept, uid: concept.id + "-a", expression: concept.forms[0] },
          { ...concept, uid: concept.id + "-b", expression: concept.forms[1] }
        ])
      );

      board.innerHTML = "";
      setBoardColumns(deck.length);

      deck.forEach(cardData => {
        board.appendChild(createCard(cardData));
      });
      requestAnimationFrame(fitExpressions);
      startTimer();
      timerStarted = true;

    }

    function setBoardColumns(cardCount) {
      const width = board.clientWidth;
      const height = board.clientHeight;
      let bestColumns = 4;
      let bestScore = Infinity;
      for (let columns = 2; columns <= cardCount / 2; columns++) {
        if (cardCount % columns !== 0) continue;
        const rows = cardCount / columns;
        const ratio = (width / columns) / (height / rows);
        const score = Math.abs(Math.log(ratio / 1.05));
        if (score < bestScore) { bestScore = score; bestColumns = columns; }
      }
      board.style.gridTemplateColumns = `repeat(${bestColumns}, minmax(0, 1fr))`;
      board.style.gridTemplateRows = `repeat(${cardCount / bestColumns}, minmax(0, 1fr))`;
      requestAnimationFrame(fitExpressions);
    }

    new ResizeObserver(() => {
      if (!gameScreen.hidden) setBoardColumns(pairCount * 2);
    }).observe(board);

    function fitExpressions() {
      const expressions = Array.from(board.querySelectorAll(".algebra-expression"));
      let uniformSize = 56;
      expressions.forEach(expression => {
        const face = expression.parentElement;
        const style = getComputedStyle(face);
        const width = face.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight) - 6;
        const height = face.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom) - 6;
        if (width <= 0 || height <= 0) return;
        let low = 1;
        let high = Math.min(56, height / 1.25);
        for (let i = 0; i < 14; i++) {
          const size = (low + high) / 2;
          expression.style.fontSize = size + "px";
          if (expression.scrollWidth <= width && expression.getBoundingClientRect().height <= height) low = size;
          else high = size;
        }
        uniformSize = Math.min(uniformSize, low);
      });
      const size = Math.floor(uniformSize * 10) / 10;
      expressions.forEach(expression => { expression.style.fontSize = size + "px"; });
    }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
      if (!gameScreen.hidden) fitExpressions();
    });

    function flipCard(card, cardData) {
      if (lockBoard || card === firstCard || card.classList.contains("is-matched")) return;



      card.classList.add("is-flipped");
      card.setAttribute("aria-label", `Expresión: ${cardData.expression}`);

      if (!firstCard) {
        firstCard = card;
        return;
      }

      secondCard = card;
      moves += 1;


      const isMatch = firstCard.dataset.concept === secondCard.dataset.concept;

      if (isMatch) {
        handleMatch(cardData);
      } else {
        handleMismatch();
      }
    }

    function handleMatch(cardData) {
      matches += 1;


      firstCard.classList.add("is-matched");
      secondCard.classList.add("is-matched");
      firstCard.disabled = true;
      secondCard.disabled = true;

      playTone(620, 0.08);
      setTimeout(() => playTone(820, 0.1), 90);

      resetTurn();

      if (matches === selectedConcepts.length) {
        stopTimer();
        setTimeout(showWinModal, 550);
      }
    }

    function handleMismatch() {
      lockBoard = true;
      playTone(210, 0.07);

      setTimeout(() => {
        firstCard.classList.remove("is-flipped");
        secondCard.classList.remove("is-flipped");
        firstCard.setAttribute("aria-label", "Carta oculta");
        secondCard.setAttribute("aria-label", "Carta oculta");
        resetTurn();
      }, 850);
    }

    function resetTurn() {
      [firstCard, secondCard] = [null, null];
      lockBoard = false;
    }

    function startTimer() {
      startedAt = performance.now();
    }

    function stopTimer() {
      if (startedAt) seconds = Math.floor((performance.now() - startedAt) / 1000);
      startedAt = 0;
    }

    function formatTime(totalSeconds) {
      const m = Math.floor(totalSeconds / 60).toString().padStart(2, "0");
      const s = (totalSeconds % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function showWinModal() {
      document.getElementById("finalTime").textContent = formatTime(seconds);
      document.getElementById("finalMoves").textContent = String(moves);
      winModal.classList.add("show");
      playAgainBtn.focus();
    }

    function playTone(frequency, duration) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.frequency.value = frequency;
        osc.type = "sine";
        gain.gain.setValueAtTime(0.20, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
        osc.onended = () => ctx.close();
      } catch (e) {
        // El juego funciona normalmente aunque el navegador bloquee audio.
      }
    }

    function chooseDifficulty() {
      document.body.classList.remove("playing");
      stopTimer();
      winModal.classList.remove("show");
      gameScreen.hidden = true;
      board.innerHTML = "";
      difficultyScreen.hidden = false;
      difficultyScreen.querySelector("button").focus();
    }

    difficultyScreen.querySelectorAll("[data-pairs]").forEach(button => {
      button.addEventListener("click", () => startGame(Number(button.dataset.pairs)));
    });
    playAgainBtn.addEventListener("click", chooseDifficulty);
    window.addEventListener("resize", () => {
      if (!gameScreen.hidden) setBoardColumns(pairCount * 2);
    });

    function svgWrap(content, viewBox = "0 0 120 120") {
      return `<svg viewBox="${viewBox}" xmlns="http://www.w3.org/2000/svg" role="img">${content}</svg>`;
    }


    // Escenas de seguros: cada ilustración representa una situación concreta.
    function scene(content, color='#eaf3fc') {
      return svgWrap(`<rect x="2" y="2" width="176" height="136" rx="22" fill="${color}"/><g stroke="#203b56" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${content}</g>`, '0 0 180 140');
    }
    function house(x,y,k=1) {return `<g transform="translate(${x} ${y}) scale(${k})"><path d="M4 29 L34 4 L64 29" fill="#ef8668"/><path d="M11 27 V67 H57 V27" fill="#fff5de"/><path d="M29 67 V44 H42 V67" fill="#72b7ca"/><rect x="17" y="34" width="9" height="12" fill="#acd9ef"/></g>`;}
    function person(x,y,color='#5e9bcc') {return `<g transform="translate(${x} ${y})"><circle cy="-14" r="9" fill="#f4c9a5"/><path d="M-15 23 V8 Q-15 -2 0 -2 Q15 -2 15 8 V23" fill="${color}"/></g>`;}
    function coin(x,y,r=12) {return `<circle cx="${x}" cy="${y}" r="${r}" fill="#ffd365" stroke="#b78326"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="${r+4}" font-family="Arial" font-weight="bold" fill="#825b18" stroke="none">$</text>`;}
    function arrow(x,y,w=36,color='#24946c') {return `<path d="M${x} ${y} h${w-8} m-8 -7 l8 7 -8 7" fill="none" stroke="${color}" stroke-width="5"/>`;}
    function shield(x,y,k=1) {return `<g transform="translate(${x} ${y}) scale(${k})"><path d="M0 -27 Q16 -17 27 -17 V5 Q27 26 0 38 Q-27 26 -27 5 V-17 Q-16 -17 0 -27Z" fill="#bfe9d8" stroke="#238361"/><path d="M-13 3 l9 10 19 -23" fill="none" stroke="#238361" stroke-width="5"/></g>`;}
    function building(x,y,color='#9fc6ed') {return `<g transform="translate(${x} ${y})"><path d="M0 19 L26 3 L52 19Z" fill="${color}"/><rect x="5" y="20" width="42" height="45" fill="#fff"/><path d="M14 28 v24 m12 -24 v24 m12 -24 v24 M0 65 h52"/><rect x="18" y="55" width="16" height="10" fill="${color}"/></g>`;}

    function coordinatesMath(){return scene(`<path d="M20 76 H159 M87 123 V15" fill="none"/><path d="M153 71 l6 5 -6 5 M82 21 l5 -6 5 6" fill="none"/><path d="M132 39 V76 M87 39 H132" stroke="#d18b50" stroke-dasharray="4 4"/><circle cx="132" cy="39" r="6" fill="#e88967"/>${caption(133,27,'(x, y)',16)}${caption(161,95,'x',14)}${caption(70,22,'y',14)}`,'#fff3e9');}

    function mysteryIcon() {
      return svgWrap(`
        <circle cx="60" cy="60" r="43" fill="#edf2f7" stroke="#91a1b5" stroke-width="4"/>
        <path d="M44 45 C47 35 56 30 66 32 C77 34 83 41 82 51 C81 60 74 63 68 67 C62 71 59 75 59 82" fill="none" stroke="#667085" stroke-width="7" stroke-linecap="round"/>
        <circle cx="59" cy="94" r="5" fill="#667085"/>
      `);
    }

    const fullscreenToggle = document.getElementById("fullscreenToggle");
    function syncFullscreenButton() {
      const active = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      const label = active ? "Salir de pantalla completa" : "Ver en pantalla completa";
      fullscreenToggle.setAttribute("aria-pressed", String(active));
      fullscreenToggle.setAttribute("aria-label", label);
      fullscreenToggle.title = label;
      fullscreenToggle.querySelector("path").setAttribute("d", active
        ? "M4 9h5V4M15 4v5h5M20 15h-5v5M9 20v-5H4"
        : "M9 4H4v5M15 4h5v5M20 15v5h-5M9 20H4v-5");
      if (!gameScreen.hidden) requestAnimationFrame(() => setBoardColumns(pairCount * 2));
    }
    fullscreenToggle.addEventListener("click", async () => {
      try {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) await exit.call(document);
        } else {
          const request = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
          if (!request) { fullscreenToggle.title = "Este navegador no permite activar pantalla completa"; return; }
          await request.call(document.documentElement);
        }
        syncFullscreenButton();
      } catch (error) {
        fullscreenToggle.title = "No se pudo activar pantalla completa en este navegador";
      }
    });
    document.addEventListener("fullscreenchange", syncFullscreenButton);
    document.addEventListener("webkitfullscreenchange", syncFullscreenButton);
  </script>
