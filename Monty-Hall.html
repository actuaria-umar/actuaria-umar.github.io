
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Cabra o titulo?</title>

  <style>
    :root {
      --fondo: #f4f6f8;
      --tarjeta: #ffffff;
      --texto: #1f2937;
      --secundario: #5f6b7a;
      --borde: #d5dbe3;
      --azul: #1565c0;
      --azul-oscuro: #0d4f9a;
      --verde: #15803d;
      --rojo: #b42318;
      --puerta: #9a5b2e;
      --puerta-oscura: #63391e;
      --interior: #202735;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      background: var(--fondo);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
    }

    #monty-hall {
      width: min(100%, 900px);
      margin: 20px auto;
      padding: 30px;
      border: 1px solid var(--borde);
      border-radius: 20px;
      background: var(--tarjeta);
      text-align: center;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.09);
    }

    h1 {
      margin: 0 0 12px;
      color: #243447;
      font-size: clamp(1.7rem, 4vw, 2.4rem);
    }

    .introduccion {
      max-width: 720px;
      margin: 0 auto 24px;
      color: var(--secundario);
      line-height: 1.6;
    }

    .configuracion-participante {
      max-width: 620px;
      margin: 0 auto 22px;
      padding: 16px;
      border: 1px solid var(--borde);
      border-radius: 12px;
      background: #f8fafc;
      text-align: left;
    }

    .configuracion-participante label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
      color: #243447;
    }

    .configuracion-participante select {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid #aeb8c4;
      border-radius: 9px;
      background: #ffffff;
      color: var(--texto);
      font: inherit;
      cursor: pointer;
    }

    .configuracion-participante select:focus {
      outline: 3px solid rgba(21, 101, 192, 0.20);
      border-color: var(--azul);
    }

    .configuracion-participante select:disabled {
      background: #eef2f6;
      color: #5f6b7a;
    }

    .ayuda-carrera {
      margin: 7px 0 0;
      color: var(--secundario);
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .mensaje {
      min-height: 58px;
      margin-bottom: 24px;
      padding: 14px 18px;
      border: 1px solid #cfd8e3;
      border-radius: 12px;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.08rem;
      line-height: 1.45;
    }

    .puertas {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
      margin: 26px 0;
    }

    .puerta {
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .puerta:disabled {
      cursor: default;
    }

    .marco {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      padding: 10px;
      border-radius: 14px 14px 8px 8px;
      background: #4a2b19;
      box-shadow: 0 9px 18px rgba(15, 23, 42, 0.18);
      perspective: 900px;
    }

    .interior {
      position: absolute;
      inset: 10px;
      border-radius: 7px 7px 3px 3px;
      background: var(--interior);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      overflow: hidden;
    }

    .premio {
      width: 88%;
      min-height: 44%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2.5rem, 7vw, 4.6rem);
      transform: scale(0.65);
      opacity: 0;
      transition: 350ms ease;
    }

    .premio img {
      display: block;
      width: 100%;
      max-height: 82%;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.35);
    }

    .nombre-premio {
      max-width: 90%;
      margin-top: 8px;
      font-size: clamp(0.62rem, 1.7vw, 0.9rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1.25;
      opacity: 0;
      transition: opacity 350ms ease;
    }

    .panel {
      position: absolute;
      inset: 10px;
      border: 3px solid var(--puerta-oscura);
      border-radius: 7px 7px 3px 3px;
      background:
        linear-gradient(90deg, rgba(255,255,255,.08), transparent 25%, transparent 75%, rgba(0,0,0,.12)),
        var(--puerta);
      transform-origin: left center;
      transform: rotateY(0deg);
      transition: transform 720ms cubic-bezier(.2,.72,.28,1);
      backface-visibility: hidden;
      box-shadow: inset -8px 0 12px rgba(0,0,0,.12);
    }

    .numero {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #f7d58b;
      border: 3px solid #7a4a20;
      color: #5b3217;
      font-size: 1.35rem;
      font-weight: 800;
    }

    .detalle {
      position: absolute;
      left: 18%;
      right: 18%;
      top: 36%;
      bottom: 18%;
      border: 4px solid rgba(91, 50, 23, .75);
      border-radius: 5px;
    }

    .perilla {
      position: absolute;
      right: 11%;
      top: 52%;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #e4bd5d;
      border: 2px solid #76501b;
    }

    .etiqueta {
      display: block;
      min-height: 25px;
      margin-top: 12px;
      color: var(--secundario);
      font-weight: 700;
    }

    .puerta:hover:not(:disabled) .marco {
      transform: translateY(-4px);
    }

    .puerta.seleccionada .marco {
      outline: 5px solid rgba(21, 101, 192, .32);
    }

    .puerta.seleccionada .etiqueta {
      color: var(--azul);
    }

    .puerta.abierta .panel {
      transform: rotateY(-105deg);
    }

    .puerta.abierta .premio,
    .puerta.revelada .premio {
      transform: scale(1);
      opacity: 1;
    }

    .puerta.abierta .nombre-premio,
    .puerta.revelada .nombre-premio {
      opacity: 1;
    }

    .puerta.eleccion-final {
      z-index: 4;
    }

    .puerta.eleccion-final .marco {
      outline: 8px solid #d99a13;
      outline-offset: 5px;
      transform: translateY(-10px) scale(1.045);
      box-shadow:
        0 0 0 8px rgba(217, 154, 19, 0.18),
        0 18px 32px rgba(122, 76, 0, 0.30);
    }

    .puerta.eleccion-final .etiqueta {
      color: #8a5a00;
      font-weight: 800;
    }

    .puerta.ganadora .marco {
      outline: 5px solid rgba(21, 128, 61, .42);
    }

    .puerta.perdedora .marco {
      outline: 5px solid rgba(180, 35, 24, .34);
    }

    .acciones {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
    }

    .acciones button {
      min-width: 190px;
      padding: 13px 20px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: 160ms ease;
    }

    .acciones button:hover {
      transform: translateY(-2px);
    }

    #conservar,
    #reiniciar {
      border: 1px solid #9aa5b1;
      background: #f3f4f6;
      color: #374151;
    }

    #cambiar {
      border: 1px solid var(--azul);
      background: var(--azul);
      color: white;
    }

    #cambiar:hover {
      background: var(--azul-oscuro);
    }

    .resultado {
      position: relative;
      z-index: 5;
      width: 100%;
      margin-top: 28px;
      padding: clamp(24px, 5vw, 42px);
      border-radius: 20px;
      line-height: 1.35;
      overflow: hidden;
      transform-origin: center;
    }

    .resultado.aparecer {
      animation: entrada-resultado 700ms
        cubic-bezier(0.18, 0.82, 0.28, 1.18);
    }

    .resultado.gano {
      border: 3px solid #4f9d69;
      background:
        radial-gradient(circle at top, #ffffff 0%, #ecfff2 68%, #d7f4df 100%);
      color: #14532d;
      box-shadow:
        0 18px 40px rgba(21, 128, 61, 0.24),
        inset 0 0 0 7px rgba(255, 255, 255, 0.55);
    }

    .resultado.perdio {
      border: 3px solid #c58a34;
      background:
        radial-gradient(circle at top, #fffef8 0%, #fff5d9 68%, #f5dfaa 100%);
      color: #6b4217;
      box-shadow:
        0 18px 40px rgba(154, 91, 46, 0.24),
        inset 0 0 0 7px rgba(255, 255, 255, 0.55);
    }

    .resultado-icono {
      display: block;
      margin-bottom: 8px;
      font-size: clamp(4.5rem, 13vw, 8rem);
      line-height: 1;
      filter: drop-shadow(0 7px 7px rgba(0, 0, 0, 0.18));
    }

    .resultado-titulo {
      display: block;
      margin: 0;
      font-size: clamp(2rem, 7vw, 4.4rem);
      line-height: 1.04;
      font-weight: 900;
      letter-spacing: -0.035em;
    }

    .resultado-texto {
      display: block;
      max-width: 720px;
      margin: 16px auto 0;
      font-size: clamp(1.08rem, 3vw, 1.55rem);
      line-height: 1.45;
      font-weight: 700;
    }

    .resultado-remate {
      display: block;
      margin-top: 13px;
      font-size: clamp(0.95rem, 2.4vw, 1.2rem);
      font-weight: 600;
    }

    #fuegos-artificiales {
      position: fixed;
      inset: 0;
      z-index: 1000;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .resultado-pantalla-completa {
      position: fixed;
      inset: 0;
      z-index: 950;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(20px, 5vw, 70px);
      background: rgba(8, 15, 28, 0.94);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      overflow: hidden;
    }

    .resultado-pantalla-completa[hidden] {
      display: none;
    }

    .resultado-pantalla-completa.gano {
      background:
        radial-gradient(
          circle at top,
          #ffffff 0%,
          #ecfff2 68%,
          #d7f4df 100%
        );
      color: #14532d;
    }

    .resultado-pantalla-completa.perdio {
      background:
        radial-gradient(
          circle at top,
          #fffef8 0%,
          #fff5d9 68%,
          #f5dfaa 100%
        );
      color: #6b4217;
    }

    .resultado-pantalla-contenido {
      width: min(100%, 1100px);
      text-align: center;
      color: inherit;
      animation: entrada-pantalla-completa 750ms
        cubic-bezier(0.18, 0.82, 0.28, 1.18);
    }

    .resultado-pantalla-completa .resultado-icono {
      margin-bottom: clamp(10px, 2vh, 22px);
      font-size: clamp(7rem, 24vw, 16rem);
    }

    .resultado-pantalla-completa .resultado-titulo {
      font-size: clamp(3rem, 10vw, 7.5rem);
      line-height: 0.98;
      color: inherit;
      text-shadow: 0 4px 12px rgba(255, 255, 255, 0.72);
    }

    .resultado-pantalla-completa .resultado-texto {
      max-width: 950px;
      margin-top: clamp(20px, 4vh, 38px);
      font-size: clamp(1.45rem, 4.2vw, 3rem);
      color: inherit;
      text-shadow: 0 3px 10px rgba(255, 255, 255, 0.70);
    }

    .resultado-pantalla-completa .resultado-remate {
      margin-top: clamp(15px, 3vh, 28px);
      font-size: clamp(1.05rem, 2.8vw, 1.8rem);
      color: inherit;
      opacity: 0.90;
    }

    .resultado-pantalla-aviso {
      position: absolute;
      right: 0;
      bottom: clamp(16px, 3vh, 30px);
      left: 0;
      padding: 0 20px;
      color: inherit;
      opacity: 0.66;
      font-size: clamp(0.85rem, 1.8vw, 1.05rem);
      text-align: center;
    }

    .resultado-pantalla-completa.saliendo {
      animation: salida-pantalla-completa 450ms ease forwards;
    }

    @keyframes entrada-pantalla-completa {
      0% {
        opacity: 0;
        transform: scale(0.48) rotate(-2deg);
      }

      65% {
        opacity: 1;
        transform: scale(1.06) rotate(1deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes salida-pantalla-completa {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    @keyframes entrada-resultado {
      0% {
        opacity: 0;
        transform: scale(0.55) rotate(-2deg);
      }

      60% {
        opacity: 1;
        transform: scale(1.055) rotate(1deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    .explicacion {
      margin-top: 28px;
      padding: 20px;
      border-left: 5px solid var(--azul);
      border-radius: 8px;
      background: #f7f9fc;
      text-align: left;
      line-height: 1.6;
      color: #374151;
    }

    .explicacion h2 {
      margin: 0 0 10px;
      font-size: 1.2rem;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 700px) {
      #monty-hall {
        padding: 22px 14px;
      }

      .puertas {
        gap: 10px;
      }

      .marco {
        padding: 6px;
      }

      .interior,
      .panel {
        inset: 6px;
      }

      .numero {
        width: 36px;
        height: 36px;
        font-size: 1rem;
      }

      .etiqueta {
        font-size: .85rem;
      }
    }

    @media (max-width: 440px) {
      body {
        padding: 8px;
      }

      .puertas {
        gap: 6px;
      }

      .acciones button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .panel,
      .premio,
      .nombre-premio,
      .acciones button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <canvas
    id="fuegos-artificiales"
    aria-hidden="true">
  </canvas>

  <section
    id="resultado-pantalla-completa"
    class="resultado-pantalla-completa"
    role="status"
    aria-live="assertive"
    aria-atomic="true"
    hidden
  >
    <div
      id="resultado-pantalla-contenido"
      class="resultado-pantalla-contenido">
    </div>

    <!-- <div class="resultado-pantalla-aviso">
      El resultado desaparecerá automáticamente en unos segundos.
    </div> -->
  </section>

  <main id="monty-hall">
    <h1>¿Cabra o Título profesional?</h1>

    <!-- <p class="introduccion">
      Detrás de una puerta se encuentra un título profesional y
      detrás de las otras dos hay cabras.
    </p> -->

    <div class="configuracion-participante">
      <label for="carrera-estudiante">
        Carrera del estudiante
      </label>

      <select id="carrera-estudiante">
        <option value="Actuaría" selected>
          Actuaría
        </option>
        <option value="Administración Turística">
          Administración Turística
        </option>
        <option value="Ciencias de la Comunicación">
          Ciencias de la Comunicación
        </option>
        <option value="Ciencias Marítimas y Portuarias">
          Ciencias Marítimas y Portuarias
        </option>
        <option value="Economía">
          Economía
        </option>
        <option value="Relaciones Internacionales">
          Relaciones Internacionales
        </option>
      </select>

      <!-- <p class="ayuda-carrera">
        Selecciona la carrera antes de que el estudiante elija una puerta.
      </p> -->
    </div>

    <div id="mensaje" class="mensaje" aria-live="polite">
      Elige una de las tres puertas.
    </div>

    <section class="puertas" aria-label="Puertas del concurso">
      <button class="puerta" type="button" data-puerta="0" aria-label="Elegir la puerta 1">
        <span class="marco">
          <span class="interior">
            <span class="premio" aria-hidden="true"></span>
            <span class="nombre-premio"></span>
          </span>
          <span class="panel">
            <span class="numero">1</span>
            <span class="detalle"></span>
            <span class="perilla"></span>
          </span>
        </span>
        <span class="etiqueta">Puerta 1</span>
      </button>

      <button class="puerta" type="button" data-puerta="1" aria-label="Elegir la puerta 2">
        <span class="marco">
          <span class="interior">
            <span class="premio" aria-hidden="true"></span>
            <span class="nombre-premio"></span>
          </span>
          <span class="panel">
            <span class="numero">2</span>
            <span class="detalle"></span>
            <span class="perilla"></span>
          </span>
        </span>
        <span class="etiqueta">Puerta 2</span>
      </button>

      <button class="puerta" type="button" data-puerta="2" aria-label="Elegir la puerta 3">
        <span class="marco">
          <span class="interior">
            <span class="premio" aria-hidden="true"></span>
            <span class="nombre-premio"></span>
          </span>
          <span class="panel">
            <span class="numero">3</span>
            <span class="detalle"></span>
            <span class="perilla"></span>
          </span>
        </span>
        <span class="etiqueta">Puerta 3</span>
      </button>
    </section>

    <div id="acciones-decision" class="acciones" hidden>
      <button id="conservar" type="button">Conservar mi puerta</button>
      <button id="cambiar" type="button">Cambiar de puerta</button>
    </div>

    <div id="acciones-finales" class="acciones" hidden>
      <button id="reiniciar" type="button">Jugar nuevamente</button>
    </div>

    <div id="resultado" class="resultado" aria-live="polite" hidden></div>
<!-- 
    <section class="explicacion">
      <h2>¿Dónde está la paradoja?</h2>
      <p>
        En el planteamiento clásico, la puerta elegida inicialmente tiene
        probabilidad <strong>1/3</strong> de contener el premio. Las otras
        dos puertas concentran una probabilidad de <strong>2/3</strong>.
      </p>
      <p>
        El presentador sabe dónde está el premio y siempre abre una puerta
        con una cabra. Por ello, cambiar de puerta conserva la probabilidad
        de <strong>2/3</strong> asociada originalmente a las puertas no elegidas.
      </p>
    </section> -->
  </main>

  <script>
    (() => {
      "use strict";

      const puertas = Array.from(document.querySelectorAll(".puerta"));
      const mensaje = document.getElementById("mensaje");
      const accionesDecision = document.getElementById("acciones-decision");
      const accionesFinales = document.getElementById("acciones-finales");
      const conservar = document.getElementById("conservar");
      const cambiar = document.getElementById("cambiar");
      const reiniciar = document.getElementById("reiniciar");
      const resultado = document.getElementById("resultado");
      const carreraEstudiante =
        document.getElementById("carrera-estudiante");
      const canvasFuegos =
        document.getElementById("fuegos-artificiales");
      const contextoFuegos =
        canvasFuegos.getContext("2d");

      const pantallaCompleta =
        document.getElementById(
          "resultado-pantalla-completa"
        );

      const pantallaCompletaContenido =
        document.getElementById(
          "resultado-pantalla-contenido"
        );

      /*
       * Logotipo de la Universidad del Mar proporcionado para
       * representar el título profesional. La imagen se encuentra

      function obtenerNombreCarrera() {
        const carrera = carreraEstudiante.value.trim();

        return carrera || "la carrera del estudiante";
      }

      function escaparTextoSVG(texto) {
        return texto
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&apos;");
      }

      function dividirTexto(texto, maximoCaracteres) {
        const palabras = texto.trim().split(/\s+/);
        const lineas = [];
        let lineaActual = "";

        palabras.forEach(palabra => {
          const propuesta = lineaActual
            ? `${lineaActual} ${palabra}`
            : palabra;

          if (
            propuesta.length > maximoCaracteres &&
            lineaActual
          ) {
            lineas.push(lineaActual);
            lineaActual = palabra;
          } else {
            lineaActual = propuesta;
          }
        });

        if (lineaActual) {
          lineas.push(lineaActual);
        }

        return lineas.slice(0, 3);
      }

      function crearImagenTitulo(nombreCarrera) {
        const lineasCarrera = dividirTexto(
          `LICENCIATURA EN ${nombreCarrera.toUpperCase()}`,
          30
        );

        const textoCarrera = lineasCarrera
          .map(
            (linea, indice) =>
              `<text x="400" y="${315 + indice * 34}" ` +
              `text-anchor="middle" font-family="Georgia, serif" ` +
              `font-size="25" font-weight="700" fill="#183153">` +
              `${escaparTextoSVG(linea)}</text>`
          )
          .join("");

        const svg = `
          <svg xmlns="http://www.w3.org/2000/svg"
               width="800" height="520"
               viewBox="0 0 800 520">
            <defs>
              <linearGradient id="papel" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#fffdf4"/>
                <stop offset="1" stop-color="#f2e5be"/>
              </linearGradient>
              <filter id="sombra">
                <feDropShadow dx="0" dy="5" stdDeviation="5"
                              flood-color="#000000"
                              flood-opacity="0.28"/>
              </filter>
            </defs>

            <rect x="18" y="18" width="764" height="484" rx="8"
                  fill="url(#papel)" stroke="#9b6b22"
                  stroke-width="8" filter="url(#sombra)"/>

            <rect x="38" y="38" width="724" height="444" rx="4"
                  fill="none" stroke="#c59a45" stroke-width="3"/>

            <image
              href="${LOGOTIPO_UMAR}"
              x="363"
              y="48"
              width="74"
              height="92"
              preserveAspectRatio="xMidYMid meet"
            />

            <text x="400" y="176" text-anchor="middle"
                  font-family="Georgia, serif" font-size="34"
                  font-weight="700" fill="#173b63">
              UNIVERSIDAD DEL MAR
            </text>

            <text x="400" y="220" text-anchor="middle"
                  font-family="Georgia, serif" font-size="20"
                  fill="#60451f">
              Otorga el presente
            </text>

            <text x="400" y="265" text-anchor="middle"
                  font-family="Georgia, serif" font-size="31"
                  font-weight="700" fill="#8a5a00">
              TÍTULO PROFESIONAL
            </text>

            ${textoCarrera}

            <line x1="130" y1="420" x2="330" y2="420"
                  stroke="#60451f" stroke-width="2"/>
            <line x1="470" y1="420" x2="670" y2="420"
                  stroke="#60451f" stroke-width="2"/>

            <text x="230" y="446" text-anchor="middle"
                  font-family="Arial, sans-serif" font-size="13"
                  fill="#60451f">Firma institucional</text>

            <text x="570" y="446" text-anchor="middle"
                  font-family="Arial, sans-serif" font-size="13"
                  fill="#60451f">Sello universitario</text>

            <text x="400" y="478" text-anchor="middle"
                  font-family="Arial, sans-serif" font-size="11"
                  fill="#7c6a4b">
              Representación ilustrativa para la dinámica
            </text>
          </svg>
        `;

        return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
      }

      function asignarPremios() {
        const nombreCarrera = obtenerNombreCarrera();

        puertas.forEach((puerta, indice) => {
          const icono = puerta.querySelector(".premio");
          const nombre = puerta.querySelector(".nombre-premio");

          if (indice === puertaPremio) {
            const imagenTitulo = document.createElement("img");
            imagenTitulo.src = crearImagenTitulo(nombreCarrera);
            imagenTitulo.alt =
              `Título profesional de la Universidad del Mar en ${nombreCarrera}`;

            icono.replaceChildren(imagenTitulo);
            nombre.textContent =
              `TÍTULO PROFESIONAL EN ${nombreCarrera.toUpperCase()}`;
          } else {
            icono.textContent = "🐐";
            nombre.textContent = "CABRA";
          }
        });
      }

      function elegirPuerta(indice) {
        if (fase !== "elegir") return;

        fase = "presentador";
        puertaElegida = indice;
        puertaAbierta = null;

        asignarPremios();
        carreraEstudiante.disabled = true;

        puertas[indice].classList.add("seleccionada");

        /*
         * La puerta elegida por el estudiante queda bloqueada.
         * Las otras dos permanecen disponibles para que el
         * presentador abra manualmente una de ellas.
         */
        puertas.forEach((puerta, numeroPuerta) => {
          puerta.disabled = numeroPuerta === puertaElegida;
        });

        mensaje.textContent =
          `¡Muy bien! Haz, elegido la puerta ${indice + 1}. `;
      }

      function abrirPuertaDelPresentador(indice) {
        if (fase !== "presentador") return;

        /*
         * El presentador no puede abrir la puerta seleccionada
         * por el estudiante ni la puerta que contiene el premio.
         */
        if (
          indice === puertaElegida ||
          indice === puertaPremio
        ) {
          mensaje.textContent =
            "";
          return;
        }

        puertaAbierta = indice;

        const puerta = puertas[puertaAbierta];
        puerta.classList.add("abierta");

        /*
         * Después de abrir la puerta con la cabra, se bloquean
         * las puertas hasta que el estudiante tome su decisión.
         */
        puertas.forEach(puertaActual => {
          puertaActual.disabled = true;
        });

        fase = "decidir";

        mensaje.textContent =
          `¡Ojo! La puerta ${puertaAbierta + 1} contiene una cabra. `;

        accionesDecision.hidden = false;
      }

      function puertaAlternativa() {
        return puertas
          .map((_, indice) => indice)
          .find(indice => indice !== puertaElegida && indice !== puertaAbierta);
      }

      function registrarDecision(estrategia) {
        if (fase !== "decidir") return;

        estrategiaFinal = estrategia;

        eleccionFinal =
          estrategia === "cambiar"
            ? puertaAlternativa()
            : puertaElegida;

        accionesDecision.hidden = true;

        /*
         * La selección inicial deja de ser el resaltado principal.
         * La puerta final elegida queda destacada y es la única
         * puerta cerrada que puede abrirse.
         */
        puertas.forEach((puerta, indice) => {
          puerta.classList.remove("seleccionada");
          puerta.classList.toggle(
            "eleccion-final",
            indice === eleccionFinal
          );

          puerta.disabled = indice !== eleccionFinal;
        });

        fase = "esperar-revelacion";

        if (estrategia === "cambiar") {
          mensaje.textContent =
            `El estudiante decidió cambiar a la puerta ` +
            `${eleccionFinal + 1}. Haz clic en esa puerta para ` +
            "descubrir el resultado.";
        } else {
          mensaje.textContent =
            `El estudiante decidió conservar la puerta ` +
            `${eleccionFinal + 1}. Haz clic en esa puerta para ` +
            "descubrir el resultado.";
        }
      }

      function ajustarCanvasFuegos() {
        const proporcion = Math.max(
          1,
          Math.min(window.devicePixelRatio || 1, 2)
        );

        canvasFuegos.width =
          Math.floor(window.innerWidth * proporcion);
        canvasFuegos.height =
          Math.floor(window.innerHeight * proporcion);

        canvasFuegos.style.width =
          `${window.innerWidth}px`;
        canvasFuegos.style.height =
          `${window.innerHeight}px`;

        contextoFuegos.setTransform(
          proporcion,
          0,
          0,
          proporcion,
          0,
          0
        );
      }

      function crearExplosion(x, y, intensidad, tipo) {
        const coloresTitulo = [
          "#ffd166",
          "#06d6a0",
          "#118ab2",
          "#ef476f",
          "#ffffff"
        ];

        const coloresCabra = [
          "#f4a261",
          "#e9c46a",
          "#2a9d8f",
          "#ffffff",
          "#8d6e63"
        ];

        const colores =
          tipo === "titulo"
            ? coloresTitulo
            : coloresCabra;

        const cantidad =
          Math.floor(34 * intensidad);

        for (let i = 0; i < cantidad; i++) {
          const angulo =
            (Math.PI * 2 * i) / cantidad +
            Math.random() * 0.18;

          const velocidad =
            (2.2 + Math.random() * 4.6) *
            intensidad;

          particulasFuegos.push({
            x,
            y,
            anteriorX: x,
            anteriorY: y,
            vx: Math.cos(angulo) * velocidad,
            vy: Math.sin(angulo) * velocidad,
            gravedad: 0.055 + Math.random() * 0.045,
            friccion: 0.982,
            vida: 1,
            desgaste: 0.010 + Math.random() * 0.010,
            tamano: 1.5 + Math.random() * 2.2,
            color:
              colores[
                Math.floor(Math.random() * colores.length)
              ]
          });
        }
      }

      function dibujarFuegos() {
        contextoFuegos.clearRect(
          0,
          0,
          window.innerWidth,
          window.innerHeight
        );

        contextoFuegos.globalCompositeOperation =
          "lighter";

        particulasFuegos = particulasFuegos.filter(
          particula => particula.vida > 0
        );

        particulasFuegos.forEach(particula => {
          particula.anteriorX = particula.x;
          particula.anteriorY = particula.y;

          particula.vx *= particula.friccion;
          particula.vy *= particula.friccion;
          particula.vy += particula.gravedad;

          particula.x += particula.vx;
          particula.y += particula.vy;
          particula.vida -= particula.desgaste;

          contextoFuegos.beginPath();
          contextoFuegos.moveTo(
            particula.anteriorX,
            particula.anteriorY
          );
          contextoFuegos.lineTo(
            particula.x,
            particula.y
          );
          contextoFuegos.lineWidth =
            particula.tamano;
          contextoFuegos.strokeStyle =
            particula.color;
          contextoFuegos.globalAlpha =
            Math.max(particula.vida, 0);
          contextoFuegos.stroke();
        });

        contextoFuegos.globalAlpha = 1;
        contextoFuegos.globalCompositeOperation =
          "source-over";

        const continuar =
          particulasFuegos.length > 0 ||
          performance.now() < tiempoFinalFuegos;

        if (continuar) {
          animacionFuegos =
            requestAnimationFrame(dibujarFuegos);
        } else {
          animacionFuegos = null;

          contextoFuegos.clearRect(
            0,
            0,
            window.innerWidth,
            window.innerHeight
          );
        }
      }

      function lanzarFuegosArtificiales(tipo) {
        if (
          window.matchMedia(
            "(prefers-reduced-motion: reduce)"
          ).matches
        ) {
          return;
        }

        ajustarCanvasFuegos();

        if (animacionFuegos !== null) {
          cancelAnimationFrame(animacionFuegos);
        }

        particulasFuegos = [];
        tiempoFinalFuegos =
          performance.now() +
          (tipo === "titulo" ? 3400 : 2200);

        const explosiones =
          tipo === "titulo" ? 10 : 6;

        for (let i = 0; i < explosiones; i++) {
          window.setTimeout(() => {
            const margenX =
              window.innerWidth * 0.12;

            const x =
              margenX +
              Math.random() *
                (window.innerWidth - 2 * margenX);

            const y =
              window.innerHeight * 0.12 +
              Math.random() *
                (window.innerHeight * 0.48);

            crearExplosion(
              x,
              y,
              tipo === "titulo" ? 1.15 : 0.85,
              tipo
            );
          }, i * (tipo === "titulo" ? 260 : 300));
        }

        animacionFuegos =
          requestAnimationFrame(dibujarFuegos);
      }

      function ocultarResultadoPantallaCompleta() {
        if (pantallaCompleta.hidden) {
          return;
        }

        pantallaCompleta.classList.add("saliendo");

        window.setTimeout(() => {
          pantallaCompleta.hidden = true;
          pantallaCompleta.className =
            "resultado-pantalla-completa";
          pantallaCompletaContenido.innerHTML = "";
          document.body.style.overflow = "";
        }, 450);
      }

      function mostrarResultadoPantallaCompleta(
        tipo,
        nombreCarrera
      ) {
        if (temporizadorPantallaCompleta !== null) {
          window.clearTimeout(
            temporizadorPantallaCompleta
          );
        }

        pantallaCompleta.className =
          `resultado-pantalla-completa ` +
          `${tipo === "titulo" ? "gano" : "perdio"}`;

        if (tipo === "titulo") {
          pantallaCompletaContenido.innerHTML =
            `<span class="resultado-icono" aria-hidden="true">🎓</span>` +
            `<strong class="resultado-titulo">` +
            `¡Hoy no hay cabra: hay título!</strong>` +
            `<span class="resultado-texto">` +
            `El estudiante se lleva a casa su título profesional en ` +
            `${nombreCarrera} por la Universidad del Mar.</span>` +
            `<span class="resultado-remate">` +
            `¡Que vuelen los birretes y comience la celebración!</span>`;
        } else {
          pantallaCompletaContenido.innerHTML =
            `<span class="resultado-icono" aria-hidden="true">🐐</span>` +
            `<strong class="resultado-titulo">` +
            `¡Beee-envenida a la familia!</strong>` +
            `<span class="resultado-texto">` +
            `El estudiante se lleva una cabra a casa.</span>` +
            `<span class="resultado-remate">` +
            `Esperemos que también asista a clases y entregue las tareas.</span>`;
        }

        document.body.style.overflow = "hidden";
        pantallaCompleta.hidden = false;

        /*
         * Reinicia la animación de entrada.
         */
        void pantallaCompletaContenido.offsetWidth;

        temporizadorPantallaCompleta =
          window.setTimeout(() => {
            ocultarResultadoPantallaCompleta();
            temporizadorPantallaCompleta = null;
          }, DURACION_PANTALLA_COMPLETA);
      }

      function mostrarMensajeGrande(tipo, nombreCarrera) {
        resultado.className =
          `resultado ${tipo === "titulo" ? "gano" : "perdio"}`;

        if (tipo === "titulo") {
          resultado.innerHTML =
            `<span class="resultado-icono" aria-hidden="true">🎓</span>` +
            `<strong class="resultado-titulo">` +
            `¡Hoy no hay cabra: hay título!</strong>` +
            `<span class="resultado-texto">` +
            `El estudiante se lleva a casa su título profesional en ` +
            `${nombreCarrera} por la Universidad del Mar.</span>` +
            `<span class="resultado-remate">` +
            `¡Que vuelen los birretes y comience la celebración!</span>`;
        } else {
          resultado.innerHTML =
            `<span class="resultado-icono" aria-hidden="true">🐐</span>` +
            `<strong class="resultado-titulo">` +
            `¡Beee-envenida a la familia!</strong>` +
            `<span class="resultado-texto">` +
            `El estudiante se lleva una cabra a casa.</span>` +
            `<span class="resultado-remate">` +
            `Esperemos que también asista a clases y entregue las tareas.</span>`;
        }

        resultado.hidden = false;

        /*
         * Reinicia la animación aunque el mismo bloque ya
         * se haya mostrado anteriormente.
         */
        void resultado.offsetWidth;
        resultado.classList.add("aparecer");

        lanzarFuegosArtificiales(tipo);

        /*
         * Este mensaje corresponde al contenido de la puerta
         * con la que finalmente se quedó el estudiante.
         */
        mostrarResultadoPantallaCompleta(
          tipo,
          nombreCarrera
        );
      }

      function mostrarMensajePremioEncontrado(nombreCarrera) {
        resultado.className =
          "resultado gano";

        resultado.innerHTML =
          `<span class="resultado-icono" aria-hidden="true">🎓</span>` +
          `<strong class="resultado-titulo">` +
          `¡El título estaba aquí!</strong>` +
          `<span class="resultado-texto">` +
          `El título profesional en ${nombreCarrera} esperaba detrás ` +
          `de la puerta ${puertaPremio + 1}.</span>` +
          `<span class="resultado-remate">` +
          `La cabra ya tiene compañía, pero el misterio quedó resuelto.</span>`;

        resultado.hidden = false;

        void resultado.offsetWidth;
        resultado.classList.add("aparecer");

        lanzarFuegosArtificiales("titulo");
      }

      function mostrarResultado(indice) {
        if (
          fase !== "esperar-revelacion" ||
          indice !== eleccionFinal
        ) {
          return;
        }

        fase = "revelando";

        puertas.forEach(puerta => {
          puerta.disabled = true;
        });

        /*
         * Se abre únicamente la puerta con la que finalmente
         * se quedó el estudiante.
         */
        puertas[eleccionFinal].classList.add("abierta");

        const gano = eleccionFinal === puertaPremio;
        const nombreCarrera = obtenerNombreCarrera();

        if (gano) {
          /*
           * Si el estudiante eligió la puerta del premio, el resultado
           * puede mostrarse después de terminar la animación de apertura.
           */
          puertas[puertaPremio].classList.add("ganadora");

          window.setTimeout(() => {
            fase = "finalizada";

            mensaje.textContent =
              `¡El estudiante ganó su título profesional en ` +
              `${nombreCarrera}!`;

            mostrarMensajeGrande(
              "titulo",
              nombreCarrera
            );

            accionesFinales.hidden = false;
          }, RETARDO_RESULTADO_PANTALLA);

          return;
        }

        /*
         * Si la elección final contiene una cabra, todavía no se abre
         * la puerta donde se encuentra el premio. Se mantiene cerrada
         * hasta que el presentador haga clic en ella.
         */
        puertas[eleccionFinal].classList.add("perdedora");

        window.setTimeout(() => {
          fase = "esperar-premio";

          puertas.forEach((puerta, numeroPuerta) => {
            puerta.disabled = numeroPuerta !== puertaPremio;
          });

          puertas[puertaPremio].classList.add("eleccion-final");

          mensaje.textContent =
            `La puerta ${eleccionFinal + 1} contiene una cabra. ` +
            `Haz clic en la puerta ${puertaPremio + 1} para descubrir ` +
            "dónde se encontraba el premio.";

          mostrarMensajeGrande(
            "cabra",
            nombreCarrera
          );
        }, RETARDO_RESULTADO_PANTALLA);
      }

      function abrirPuertaDelPremio(indice) {
        if (
          fase !== "esperar-premio" ||
          indice !== puertaPremio
        ) {
          return;
        }

        fase = "revelando-premio";

        puertas.forEach(puerta => {
          puerta.disabled = true;
        });

        puertas[puertaPremio].classList.add(
          "abierta",
          "ganadora"
        );

        const nombreCarrera = obtenerNombreCarrera();

        window.setTimeout(() => {
          fase = "finalizada";

          mensaje.textContent =
            `El título profesional en ${nombreCarrera} estaba en la ` +
            `puerta ${puertaPremio + 1}.`;

          mostrarMensajePremioEncontrado(
            nombreCarrera
          );

          accionesFinales.hidden = false;
        }, 850);
      }

      function reiniciarPartida() {
        fase = "elegir";
        puertaElegida = null;
        puertaAbierta = null;
        eleccionFinal = null;
        estrategiaFinal = null;

        puertas.forEach(puerta => {
          puerta.disabled = false;
          puerta.classList.remove(
            "seleccionada",
            "abierta",
            "revelada",
            "eleccion-final",
            "ganadora",
            "perdedora"
          );
        });

        carreraEstudiante.disabled = false;

        mensaje.textContent =
          "Pide al estudiante participante que elija una de las tres puertas.";
        resultado.hidden = true;
        resultado.textContent = "";
        resultado.className = "resultado";
        accionesDecision.hidden = true;
        accionesFinales.hidden = true;

        if (animacionFuegos !== null) {
          cancelAnimationFrame(animacionFuegos);
          animacionFuegos = null;
        }

        particulasFuegos = [];

        contextoFuegos.clearRect(
          0,
          0,
          window.innerWidth,
          window.innerHeight
        );

        if (temporizadorPantallaCompleta !== null) {
          window.clearTimeout(
            temporizadorPantallaCompleta
          );
          temporizadorPantallaCompleta = null;
        }

        pantallaCompleta.hidden = true;
        pantallaCompleta.className =
          "resultado-pantalla-completa";
        pantallaCompletaContenido.innerHTML = "";
        document.body.style.overflow = "";

        asignarPremios();
      }

      puertas.forEach((puerta, indice) => {
        puerta.addEventListener("click", () => {
          if (fase === "elegir") {
            elegirPuerta(indice);
            return;
          }

          if (fase === "presentador") {
            abrirPuertaDelPresentador(indice);
            return;
          }

          if (fase === "esperar-revelacion") {
            mostrarResultado(indice);
            return;
          }

          if (fase === "esperar-premio") {
            abrirPuertaDelPremio(indice);
          }
        });
      });

      conservar.addEventListener("click", () => {
        registrarDecision("conservar");
      });

      cambiar.addEventListener("click", () => {
        registrarDecision("cambiar");
      });
      reiniciar.addEventListener("click", reiniciarPartida);

      pantallaCompleta.addEventListener("click", () => {
        if (temporizadorPantallaCompleta !== null) {
          window.clearTimeout(
            temporizadorPantallaCompleta
          );
          temporizadorPantallaCompleta = null;
        }

        ocultarResultadoPantallaCompleta();
      });

      document.addEventListener("keydown", evento => {
        if (
          evento.key === "Escape" &&
          !pantallaCompleta.hidden
        ) {
          if (temporizadorPantallaCompleta !== null) {
            window.clearTimeout(
              temporizadorPantallaCompleta
            );
            temporizadorPantallaCompleta = null;
          }

          ocultarResultadoPantallaCompleta();
        }
      });

      window.addEventListener("resize", () => {
        if (
          particulasFuegos.length > 0 ||
          animacionFuegos !== null
        ) {
          ajustarCanvasFuegos();
        }
      });

      carreraEstudiante.addEventListener("change", () => {
        if (fase === "elegir") {
          asignarPremios();
        }
      });

      asignarPremios();
    })();
  </script>
</body>
</html>
