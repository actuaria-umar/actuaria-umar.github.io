<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memorama Actuarial | Licenciatura en Actuaría</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #667085;
      --primary: #123d6a;
      --primary-2: #1f5f99;
      --accent: #e7b64b;
      --success: #25855a;
      --danger: #b54747;
      --border: #dce3ec;
      --shadow: 0 14px 35px rgba(18, 61, 106, 0.12);
      --card-shadow: 0 9px 20px rgba(28, 47, 73, 0.16);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(31, 95, 153, 0.08), transparent 25%),
        radial-gradient(circle at 90% 15%, rgba(231, 182, 75, 0.12), transparent 20%),
        var(--bg);
    }

    button,
    select {
      font: inherit;
    }

    .app {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 22px;
      align-items: end;
      background: linear-gradient(135deg, #123d6a, #1f5f99);
      color: white;
      padding: 28px;
      border-radius: 24px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 230px;
      height: 230px;
      border: 2px solid rgba(255,255,255,.12);
      border-radius: 50%;
      right: -80px;
      top: -100px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #f8d983;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.5rem);
      line-height: 1;
      letter-spacing: -0.035em;
    }

    .subtitle {
      max-width: 720px;
      margin: 12px 0 0;
      color: rgba(255,255,255,.86);
      line-height: 1.55;
      font-size: 1rem;
    }

    .hero-badge {
      min-width: 155px;
      padding: 14px 16px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 16px;
      backdrop-filter: blur(8px);
      text-align: center;
    }

    .hero-badge strong {
      display: block;
      font-size: 1.45rem;
    }

    .hero-badge span {
      color: rgba(255,255,255,.76);
      font-size: .82rem;
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr)) auto;
      gap: 12px;
      margin: 18px 0;
      align-items: stretch;
    }

    .stat,
    .control {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px 15px;
      box-shadow: 0 6px 18px rgba(18, 61, 106, 0.05);
    }

    .stat-label,
    .control label {
      display: block;
      font-size: .76rem;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 850;
      color: var(--primary);
    }

    .control select {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--primary);
      font-weight: 800;
      outline: none;
      cursor: pointer;
    }

    .btn {
      border: 0;
      border-radius: 16px;
      padding: 0 20px;
      min-height: 62px;
      background: var(--primary);
      color: white;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(18, 61, 106, 0.16);
      transition: transform .18s ease, background .18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: var(--primary-2);
    }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .board-wrap,

    .board-wrap {
      padding: 18px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr));
      gap: 14px;
    }

    .memory-card {
      position: relative;
      aspect-ratio: 1 / 1;
      border: 0;
      background: transparent;
      perspective: 900px;
      cursor: pointer;
      padding: 0;
    }

    .memory-card:focus-visible {
      outline: 4px solid rgba(231, 182, 75, .55);
      outline-offset: 4px;
      border-radius: 18px;
    }

    .card-inner {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      transform-style: preserve-3d;
      transition: transform .45s cubic-bezier(.2,.7,.2,1);
      box-shadow: var(--card-shadow);
    }

    .memory-card.is-flipped .card-inner,
    .memory-card.is-matched .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      backface-visibility: hidden;
      overflow: hidden;
    }

    .card-back {
      display: grid;
      place-items: center;
      color: white;
      background:
        linear-gradient(145deg, rgba(255,255,255,.08), transparent 45%),
        var(--primary);
      border: 2px solid rgba(255,255,255,.14);
    }

    .card-back .mark {
      display: grid;
      place-items: center;
      width: 58%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.9);
      font-size: clamp(1.6rem, 4vw, 2.8rem);
      font-weight: 900;
      letter-spacing: -.08em;
    }

    .card-back .mark {
      background: #fff;
      border-radius: 16px;
      padding: 8px;
      border: 0;
      width: 58%;
      aspect-ratio: 1;
    }

    .card-back .mark img {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: contain;
    }

    .card-back .mini {
      position: absolute;
      bottom: 10px;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .12em;
      opacity: .8;
    }

    .card-front {
      transform: rotateY(180deg);
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 30% 20%, #ffffff, #f2f6fb 68%),
        white;
      border: 2px solid #dbe6f0;
    }

    .card-front svg {
      width: 72%;
      height: 72%;
      filter: drop-shadow(0 7px 10px rgba(18, 61, 106, .12));
    }

    .memory-card.is-matched .card-front {
      border-color: rgba(37, 133, 90, .55);
      box-shadow: inset 0 0 0 4px rgba(37, 133, 90, .12);
    }

    .memory-card.is-matched {
      cursor: default;
    }

    .info-panel {
      padding: 20px;
      position: sticky;
      top: 16px;
    }

    .info-panel h2 {
      margin: 0 0 8px;
      font-size: 1.15rem;
      color: var(--primary);
    }

    .info-panel p {
      color: var(--muted);
      line-height: 1.5;
      font-size: .94rem;
      margin: 0;
    }

    .concept-card {
      margin-top: 16px;
      border-radius: 18px;
      padding: 18px;
      background: #f7f9fc;
      border: 1px solid var(--border);
      min-height: 220px;
      display: grid;
      align-content: center;
      justify-items: center;
      text-align: center;
    }

    .concept-icon {
      width: 118px;
      height: 118px;
      display: grid;
      place-items: center;
      margin-bottom: 12px;
    }

    .concept-icon svg {
      width: 100%;
      height: 100%;
    }

    .concept-name {
      margin: 0 0 7px;
      font-size: 1.15rem;
      color: var(--primary);
      font-weight: 900;
    }

    .concept-desc {
      margin: 0;
      font-size: .88rem !important;
    }

    .tip {
      margin-top: 14px;
      padding: 13px 14px;
      border-left: 4px solid var(--accent);
      background: #fff9e9;
      border-radius: 0 12px 12px 0;
      font-size: .86rem;
      color: #6b571a;
      line-height: 1.45;
    }

    .legend {
      margin-top: 16px;
      font-size: .78rem;
      color: var(--muted);
      text-align: center;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(13, 26, 43, .58);
      backdrop-filter: blur(6px);
      z-index: 50;
    }

    .modal.show {
      display: grid;
    }

    .modal-card {
      width: min(480px, 100%);
      background: white;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 30px 80px rgba(0,0,0,.25);
      text-align: center;
      animation: pop .28s ease-out;
    }

    @keyframes pop {
      from { transform: scale(.93); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-icon {
      width: 82px;
      height: 82px;
      margin: 0 auto 10px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e9f6ef;
      font-size: 2.2rem;
    }

    .modal h2 {
      margin: 8px 0;
      color: var(--primary);
      font-size: 1.7rem;
    }

    .modal p {
      color: var(--muted);
      line-height: 1.5;
    }

    .modal-results {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 20px 0;
    }

    .modal-results div {
      padding: 13px 8px;
      border-radius: 14px;
      background: #f5f7fa;
    }

    .modal-results strong {
      display: block;
      color: var(--primary);
      font-size: 1.25rem;
    }

    .modal-results span {
      color: var(--muted);
      font-size: .75rem;
    }


    .card-front {
      padding: 12px 10px 10px;
      grid-template-rows: 1fr auto;
      gap: 8px;
    }

    .card-front svg {
      width: 72%;
      height: 72%;
      max-height: 120px;
      align-self: end;
    }

    .card-label {
      width: 100%;
      padding: 7px 8px 8px;
      border-radius: 10px;
      background: #ffffff;
      color: var(--primary);
      font-size: clamp(.72rem, 1.3vw, .95rem);
      font-weight: 900;
      line-height: 1.15;
      text-align: center;
      border: 1px solid #dbe6f0;
      box-shadow: 0 3px 8px rgba(18, 61, 106, .06);
    }

    .memory-card.is-matched .card-label {
      background: #eef9f3;
      border-color: rgba(37, 133, 90, .35);
      color: #1d6a48;
    }

    @media (max-width: 950px) {
      .game-layout {
        grid-template-columns: 1fr;
      }

      .info-panel {
        position: static;
      }

      .concept-card {
        min-height: 0;
      }

      .toolbar {
        grid-template-columns: repeat(2, 1fr);
      }

      .btn {
        grid-column: span 2;
      }
    }

    @media (max-width: 720px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .hero-badge {
        justify-self: start;
      }

      .board {
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      .board-wrap {
        padding: 10px;
      }

      .card-inner,
      .card-face {
        border-radius: 12px;
      }

      .card-back .mini {
        display: none;
      }
    }

    @media (max-width: 480px) {
      .app {
        width: min(100% - 16px, 1180px);
        padding-top: 8px;
      }

      .hero {
        padding: 22px 18px;
        border-radius: 18px;
      }

      .toolbar {
        gap: 8px;
      }

      .stat,
      .control {
        padding: 10px 12px;
      }

      .board {
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }

      .board-wrap {
        border-radius: 16px;
        padding: 8px;
      }

      .card-back .mark {
        border-width: 2px;
      }
    }
    [hidden] { display: none !important; }
    .difficulty-screen { text-align: center; background: white; padding: clamp(24px,5vw,56px); border-radius: 24px; margin-top: 24px; }
    .difficulty-screen h2 { color: var(--primary); margin: 0 0 28px; }
    .difficulty-options { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
    .difficulty-options .btn { min-width: 180px; }
    .completion-time { display: grid; gap: 8px; margin: 24px 0; color: var(--primary); }
    .completion-time strong { font-size: 3rem; font-variant-numeric: tabular-nums; }
    .career-identity { display:flex; justify-content:center; padding: 8px 16px 24px; background: #fff; border-radius:24px 24px 0 0; }
    .career-logo { display:block; width:min(420px, 85%); height:auto; clip-path:inset(3px); border:0; }
    .hero { border-radius: 0 0 24px 24px; }
    .hero { grid-template-columns: 1fr; text-align: center; }
    body.playing { overflow: hidden; }
    body.playing .career-identity, body.playing .hero { display: none; }
    body.playing .app { width: 100%; height: 100dvh; padding: 0; margin: 0; }
    body.playing .game-layout { position: fixed; inset: 0; height: 100dvh; display: block; margin: 0; }
    body.playing .board-wrap { width: 100%; height: 100%; padding: clamp(6px,1vw,14px); border-radius: 0; }
    body.playing .board { width: 100%; height: 100%; gap: clamp(5px,1vw,12px); }
    body.playing .memory-card { aspect-ratio: auto; min-width: 0; min-height: 0; width: 100%; height: 100%; }
    body.playing .card-back .mark { width: auto; height: 65%; max-width: 70%; aspect-ratio: 1; padding: 5px; }
    body.playing .card-front { padding: 5px; gap: 3px; grid-template-rows: minmax(0,1fr) auto; }
    body.playing .card-front svg { height: 100%; width: 100%; max-height: none; min-height: 0; align-self: center; }
    body.playing .card-label { padding: 3px; font-size: clamp(.62rem,1.5vw,1rem); }
    body.playing .card-back .mini { bottom: 4px; font-size: clamp(.5rem,1vw,.7rem); }
    body.playing .card-back { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: clamp(3px, .8vh, 9px); }
    body.playing .card-back .mark { flex: 0 1 auto; height: 62%; max-height: calc(100% - 30px); min-height: 0; }
    body.playing .card-back .mini { position: static; display: block; flex: 0 0 auto; color: #fff; opacity: 1; font-weight: 800; line-height: 1.2; font-size: clamp(.6rem, 1.2vw, .95rem); letter-spacing: .12em; }
  </style>
</head>

    const winModal = document.getElementById("winModal");

    let matches = 0;
    let seconds = 0;
    let timerId = null;
    let timerStarted = false;
    let selectedConcepts = [];

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function startGame(chosenPairs) {
      document.body.classList.add("playing");
      pairCount = chosenPairs;
      difficultyScreen.hidden = true;
      gameScreen.hidden = false;
      stopTimer();
      timerStarted = false;
      seconds = 0;
      moves = 0;
      matches = 0;
      firstCard = null;
      secondCard = null;
      lockBoard = false;
      winModal.classList.remove("show");

      selectedConcepts = shuffle(concepts).slice(0, pairCount);

      const deck = shuffle(
        selectedConcepts.flatMap(concept => [
          { ...concept, uid: concept.id + "-a" },
          { ...concept, uid: concept.id + "-b" }
        ])
      );

      board.innerHTML = "";
      setBoardColumns(deck.length);

      deck.forEach(cardData => {
        board.appendChild(createCard(cardData));
      });
      startTimer();
      timerStarted = true;

    }

    function setBoardColumns(cardCount) {
      const width = window.innerWidth - 24;
      const height = window.innerHeight - 24;
      let bestColumns = 4;
      let bestScore = Infinity;
      for (let columns = 2; columns <= cardCount / 2; columns++) {
        if (cardCount % columns !== 0) continue;
        const rows = cardCount / columns;
        const ratio = (width / columns) / (height / rows);
        const score = Math.abs(Math.log(ratio / 1.05));
        if (score < bestScore) { bestScore = score; bestColumns = columns; }
      }
      board.style.gridTemplateColumns = `repeat(${bestColumns}, minmax(0, 1fr))`;
      board.style.gridTemplateRows = `repeat(${cardCount / bestColumns}, minmax(0, 1fr))`;
    }

    function flipCard(card, cardData) {
      if (lockBoard || card === firstCard || card.classList.contains("is-matched")) return;



      card.classList.add("is-flipped");
      card.setAttribute("aria-label", `Carta revelada: ${cardData.name}`);

      if (!firstCard) {
        firstCard = card;
        return;
      }

      secondCard = card;
      moves += 1;


      const isMatch = firstCard.dataset.concept === secondCard.dataset.concept;

      if (isMatch) {
        handleMatch(cardData);
      } else {
        handleMismatch();
      }
    }

    function handleMatch(cardData) {
      matches += 1;


      firstCard.classList.add("is-matched");
      secondCard.classList.add("is-matched");
      firstCard.disabled = true;
      secondCard.disabled = true;

      playTone(620, 0.08);
      setTimeout(() => playTone(820, 0.1), 90);

      resetTurn();

      if (matches === selectedConcepts.length) {
        stopTimer();
        setTimeout(showWinModal, 550);
      }
    }

    function handleMismatch() {
      lockBoard = true;
      playTone(210, 0.07);

      setTimeout(() => {
        firstCard.classList.remove("is-flipped");
        secondCard.classList.remove("is-flipped");
        firstCard.setAttribute("aria-label", "Carta oculta");
        secondCard.setAttribute("aria-label", "Carta oculta");
        resetTurn();
      }, 850);
    }

    function resetTurn() {
      [firstCard, secondCard] = [null, null];
      lockBoard = false;
    }

    function startTimer() {
      startedAt = performance.now();
    }

    function stopTimer() {
      if (startedAt) seconds = Math.floor((performance.now() - startedAt) / 1000);
      startedAt = 0;
    }

    function formatTime(totalSeconds) {
      const m = Math.floor(totalSeconds / 60).toString().padStart(2, "0");
      const s = (totalSeconds % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function showWinModal() {
      document.getElementById("finalTime").textContent = formatTime(seconds);
      document.getElementById("finalMoves").textContent = String(moves);
      winModal.classList.add("show");
      playAgainBtn.focus();
    }

    function playTone(frequency, duration) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.frequency.value = frequency;
        osc.type = "sine";
        gain.gain.setValueAtTime(0.05, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        // El juego funciona normalmente aunque el navegador bloquee audio.
      }
    }

    function chooseDifficulty() {
      document.body.classList.remove("playing");
      stopTimer();
      winModal.classList.remove("show");
      gameScreen.hidden = true;
      board.innerHTML = "";
      difficultyScreen.hidden = false;
      difficultyScreen.querySelector("button").focus();
    }

    difficultyScreen.querySelectorAll("[data-pairs]").forEach(button => {
      button.addEventListener("click", () => startGame(Number(button.dataset.pairs)));
    });
    playAgainBtn.addEventListener("click", chooseDifficulty);
    window.addEventListener("resize", () => {
      if (!gameScreen.hidden) setBoardColumns(pairCount * 2);
    });

    function svgWrap(content, viewBox = "0 0 120 120") {
      return `<svg viewBox="${viewBox}" xmlns="http://www.w3.org/2000/svg" role="img">${content}</svg>`;
    }


    // Escenas de seguros: cada ilustración representa una situación concreta.
    function scene(content, color='#eaf3fc') {
      return svgWrap(`<rect x="2" y="2" width="176" height="136" rx="22" fill="${color}"/><g stroke="#203b56" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${content}</g>`, '0 0 180 140');
    }
    function house(x,y,k=1) {return `<g transform="translate(${x} ${y}) scale(${k})"><path d="M4 29 L34 4 L64 29" fill="#ef8668"/><path d="M11 27 V67 H57 V27" fill="#fff5de"/><path d="M29 67 V44 H42 V67" fill="#72b7ca"/><rect x="17" y="34" width="9" height="12" fill="#acd9ef"/></g>`;}
    function person(x,y,color='#5e9bcc') {return `<g transform="translate(${x} ${y})"><circle cy="-14" r="9" fill="#f4c9a5"/><path d="M-15 23 V8 Q-15 -2 0 -2 Q15 -2 15 8 V23" fill="${color}"/></g>`;}
    function coin(x,y,r=12) {return `<circle cx="${x}" cy="${y}" r="${r}" fill="#ffd365" stroke="#b78326"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="${r+4}" font-family="Arial" font-weight="bold" fill="#825b18" stroke="none">$</text>`;}
    function arrow(x,y,w=36,color='#24946c') {return `<path d="M${x} ${y} h${w-8} m-8 -7 l8 7 -8 7" fill="none" stroke="${color}" stroke-width="5"/>`;}
    function shield(x,y,k=1) {return `<g transform="translate(${x} ${y}) scale(${k})"><path d="M0 -27 Q16 -17 27 -17 V5 Q27 26 0 38 Q-27 26 -27 5 V-17 Q-16 -17 0 -27Z" fill="#bfe9d8" stroke="#238361"/><path d="M-13 3 l9 10 19 -23" fill="none" stroke="#238361" stroke-width="5"/></g>`;}
    function building(x,y,color='#9fc6ed') {return `<g transform="translate(${x} ${y})"><path d="M0 19 L26 3 L52 19Z" fill="${color}"/><rect x="5" y="20" width="42" height="45" fill="#fff"/><path d="M14 28 v24 m12 -24 v24 m12 -24 v24 M0 65 h52"/><rect x="18" y="55" width="16" height="10" fill="${color}"/></g>`;}
    function caption(x,y,t,size=10) {return `<text x="${x}" y="${y}" text-anchor="middle" fill="#203b56" stroke="none" font-family="Arial,sans-serif" font-size="${size}" font-weight="700">${t}</text>`;}
    function riskIcon() {return scene(`<path d="M17 30 Q14 14 29 13 Q36 0 48 12 Q67 8 69 28Z" fill="#8398af"/><path d="M43 32 l-9 17 h12 l-8 16 22 -25 H47 l8 -8" fill="#ffcb57" stroke="#b58221"/><path d="M17 40 l-4 9 m52 -12 -4 9" stroke="#6299d0"/>${house(87,53,.86)}<path d="M69 87 L88 120 H50Z" fill="#ffd365" stroke="#b58221"/>${caption(69,111,'!',23)}<path d="M77 36 q25 -4 37 8" stroke-dasharray="4 6" fill="none"/>${caption(125,30,'?',23)}`, '#fff2dd');}
    function claimIcon() {return scene(`<path d="M12 111 H168" stroke="#8d9eae"/><path d="M27 82 L39 59 H95 L111 81 L135 86 L130 106 H23 V89Z" fill="#ef7b6f"/><path d="M46 65 H66 V81 H38Z M73 65 H91 L102 81 H73Z" fill="#c8e9f6"/><circle cx="45" cy="105" r="12" fill="#354a60"/><circle cx="111" cy="105" r="12" fill="#354a60"/><path d="M134 49 v61" stroke="#8d9eae" stroke-width="8"/><path d="M118 74 l8 -11 -1 15 15 -4 -11 12 11 8 -18 -1 -3 12 -4 -16 -11 -7Z" fill="#ffd365" stroke="#bf782b"/><path d="M31 43 l-7 -9 m34 4 v-13 m40 18 8 -9" stroke="#dd665e"/>`, '#ffebe7');}
    function insuranceIcon() {return scene(`${house(12,61,.7)}${person(116,97)}${person(146,103,'#df946a')}<path d="M23 48 Q88 -8 157 48" fill="none" stroke="#58ab8b" stroke-width="10"/>${shield(86,49,.8)}<path d="M21 119 H159" stroke="#8dbba8"/>`, '#e8f7ee');}
    function policyIcon() {return scene(`<path d="M41 14 H117 L137 35 V123 H41Z" fill="#fff"/><path d="M117 14 V35 H137" fill="#c6def4"/>${caption(85,43,'PÓLIZA',14)}<path d="M56 55 h59 M56 65 h47 M56 75 h56" stroke="#a2b2c3"/><path d="M56 105 q6 -18 10 -3 t17 -5" fill="none" stroke="#3e79ad"/><circle cx="112" cy="98" r="14" fill="#fbdc83" stroke="#b38c36"/><path d="M103 111 l-3 15 12 -6 12 6 -3 -15" fill="#ed9d72"/><path d="M145 63 l9 5 -27 43 -10 6 2 -12Z" fill="#386b9a"/>`, '#edf0fc');}
    function premiumIcon() {return scene(`${person(29,80)}${building(115,36)}${coin(65,49,12)}${coin(87,49,12)}${arrow(55,81,49)}${caption(30,121,'ASEGURADO',9)}${caption(139,121,'ASEGURADORA',8)}${caption(80,28,'PAGO',11)}`, '#fff5dd');}
    function coverageIcon() {return scene(`<path d="M23 56 Q30 15 90 13 Q150 15 157 56 Q143 46 129 56 Q109 45 90 56 Q70 45 51 56 Q37 46 23 56Z" fill="#6fa9da"/><path d="M90 55 V112 q0 15 -15 11" fill="none"/>${house(23,69,.57)}${person(125,101,'#6cb795')}<path d="M14 20 l-4 9 m9 9 -4 9 m144 -27 -4 9 m12 9 -4 9" stroke="#7bb7dc"/>`, '#e8f5fc');}
    function indemnityIcon() {return scene(`${building(10,28)}${person(145,80,'#6cb795')}${arrow(68,66,49)}${coin(91,41,12)}<path d="M118 100 h35 q12 0 9 8 l-22 13 h-34 l-17 -11" fill="#f4c9a5"/><rect x="77" y="101" width="14" height="21" fill="#5689bc"/>${caption(36,120,'ASEGURADORA',8)}${caption(142,42,'$',17)}`, '#e8f7ee');}
    function deductibleIcon() {return scene(`${person(37,43,'#e2a048')}${shield(132,39,.55)}<rect x="15" y="83" width="150" height="25" rx="5" fill="#b6decf"/><path d="M20 83 H57 V108 H20 Q15 108 15 103 V88 Q15 83 20 83" fill="#f5c060"/><path d="M57 79 V112" stroke="#fff" stroke-width="4"/>${caption(36,74,'TÚ',11)}${caption(120,74,'SEGURO',10)}${caption(37,99,'$',15)}${caption(109,99,'$ $ $',15)}${caption(90,125,'PÉRDIDA TOTAL',10)}`, '#fff4e7');}
    function insuredSumIcon() {return scene(`<path d="M23 37 H157" stroke="#df7161" stroke-width="5"/>${caption(90,25,'LÍMITE MÁXIMO',11)}<path d="M152 77 V44 m-7 8 7 -8 7 8" stroke="#df7161" fill="none"/><rect x="30" y="91" width="25" height="27" rx="4" fill="#a7cce9"/><rect x="65" y="68" width="25" height="50" rx="4" fill="#78b7d9"/><rect x="100" y="42" width="25" height="76" rx="4" fill="#59a58e"/>${coin(42,103,9)}${coin(77,88,9)}${coin(112,64,9)}<path d="M22 121 H157"/>`, '#edf6f4');}
    function beneficiaryIcon() {return scene(`${person(80,60,'#668ec0')}${person(118,67,'#d28a8f')}${person(101,91,'#77b6a1')}<path d="M26 96 h45 l16 10 h39 q12 0 8 9 l-27 13 H61 L28 113" fill="#f4c9a5"/><path d="M17 92 H32 V123 H17" fill="#5f8db9"/>${coin(55,73,14)}<path d="M144 29 C134 14 119 27 129 38 l15 13 15 -13 C169 27 154 14 144 29Z" fill="#ed8a8b" stroke="#c05c6e"/>`, '#fdf0f3');}
    function reinsuranceIcon() {return scene(`${building(13,44)}${building(115,44,'#94c9b6')}${shield(39,36,.4)}${shield(141,36,.4)}${arrow(69,68,40)}${caption(90,40,'RIESGO',10)}${caption(39,125,'ASEGURADORA',8)}${caption(141,125,'REASEGURADORA',8)}<path d="M79 91 h7 m6 0 h7 m6 0 h7" stroke="#e6a23d" stroke-width="7"/>`, '#edf1fc');}
    function frequencySeverityIcon() {return scene(`<rect x="13" y="24" width="70" height="91" rx="7" fill="#fff"/><path d="M13 45 H83" stroke="#6c9abb"/><path d="M29 18 V31 m37 -13 v13" stroke="#6c9abb" stroke-width="5"/>${caption(48,62,'SINIESTROS',8)}<circle cx="29" cy="77" r="5" fill="#ed8c77"/><circle cx="48" cy="77" r="5" fill="#ed8c77"/><circle cx="67" cy="77" r="5" fill="#ed8c77"/><circle cx="29" cy="96" r="5" fill="#ed8c77"/><circle cx="48" cy="96" r="5" fill="#ed8c77"/>${coin(103,103,8)}${coin(124,97,12)}${coin(151,89,17)}${caption(129,56,'COSTO',10)}${caption(48,129,'CUÁNTOS',9)}${caption(130,129,'QUÉ TAN GRANDES',8)}`, '#f3effb');}
    function mysteryIcon() {
      return svgWrap(`
        <circle cx="60" cy="60" r="43" fill="#edf2f7" stroke="#91a1b5" stroke-width="4"/>
        <path d="M44 45 C47 35 56 30 66 32 C77 34 83 41 82 51 C81 60 74 63 68 67 C62 71 59 75 59 82" fill="none" stroke="#667085" stroke-width="7" stroke-linecap="round"/>
        <circle cx="59" cy="94" r="5" fill="#667085"/>
      `);
    }
  </script>
